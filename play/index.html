<style>
  /* pixel UI: Silkscreen for labels, Press Start 2P for the title and numbers, paragraphs stay in the system font for reading.

const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const $ = id => document.getElementById(id);
const PORTAL = '@TARGET@' === 'crazygames';                                  // the CrazyGames build: no server, no accounts, no ads (see docs/crazygames-submission.md)
/* The CrazyGames SDK object, only in the portal build and only when its init() succeeded (the loader at the end of the page starts this script after init).
   Phones do not back up localStorage reliably, so in the portal build saves go through SDK.data (cloud save for guests and signed-in players) and are
   mirrored in localStorage as a fallback; without the SDK (blocked, offline) the game simply uses localStorage. */
const CG = PORTAL ? (window.__CG || null) : null;
const cgData = () => (CG && CG.data) || null;
let cgAdPlaying = false;                                                      // a rewarded video is really playing (Full Launch only)
const cgMuted = () => cgAdPlaying || !!(CG && CG.game && CG.game.settings && CG.game.settings.muteAudio);      // the platform's mute setting wins over our own toggles
const store = {
  get(k, d) { try { const dd = cgData(); let v = dd ? dd.getItem(k) : null; if (v === null || v === undefined) v = localStorage.getItem(k); return v === null || v === undefined ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch (e) {} try { const dd = cgData(); if (dd) dd.setItem(k, s); } catch (e) {} },
};

/* ------------------------------------------------------------ settings */

const settings = Object.assign({}, DEFAULTS, store.get('pb_settings', {}));
settings.lang = 'en';                                                           // English only; the Persian strings in T.fa are kept but nothing switches to them
const saveSettings = () => store.set('pb_settings', settings);
if (!settings.heartsV2) { settings.heartsV2 = true; settings.hearts = true; saveSettings(); }          // hearts are now on by default: mistakes cost a heart

/* ----------------------------------------------------------- progression */
if (PORTAL) document.body.classList.add('portal');
/* Ads. The web build runs its own stand-in rewarded ads. The portal build runs none during Basic Launch (no SDK ads exist there): hints are free and a lost
   round just restarts. For Full Launch set CG_ADS to true: hints, the 3rd-catch retry and the revive then go through SDK.ad.requestAd('rewarded'). */
let CG_ADS = false;
let WEB_ADS = false;                                                              // the website's stand-in ads (hint refill, 3rd-catch retry, revive): off, like Basic Launch, until a real provider is chosen
const adsOn = () => PORTAL ? (CG_ADS && !!(CG && CG.ad)) : WEB_ADS;
/* Hints. With no ads (Basic Launch and the website for now) they are free and unlimited. With ads on (Full Launch): a bank of 3 to start, one more for every
   three levels newly finished with 3 stars, and a rewarded video when the bank is empty (asked in a card, never on the play screen). Any hint caps the level at 2 stars. */
const HINT_START = 3, HINT_EARN = 3;
let hintBank = store.get('pb_hints', { n: HINT_START, p: 0 });                    // n = hints in the bank, p = new 3-star levels towards the next one
const saveBank = () => store.set('pb_hints', hintBank);
const HEARTS_MAX = 3, STRIKES_MAX = 3;     // hints always cost an ad; being caught 3 times (all hearts lost) costs an ad to retry
const CHAPTERS = [
  { en: 'Cells', fa: 'سلول‌ها', size: 6 },
  { en: 'Yard I', fa: 'حیاط ۱', size: 10 }, { en: 'Yard II', fa: 'حیاط ۲', size: 10 }, { en: 'Yard III', fa: 'حیاط ۳', size: 10 },
  { en: 'Gates I', fa: 'دروازه‌ها ۱', size: 10 }, { en: 'Gates II', fa: 'دروازه‌ها ۲', size: 10 },
  { en: 'Mirrors I', fa: 'آینه‌ها ۱', size: 10 }, { en: 'Mirrors II', fa: 'آینه‌ها ۲', size: 10 },
  { en: 'Control I', fa: 'کنترل ۱', size: 10 }, { en: 'Control II', fa: 'کنترل ۲', size: 10 },
  { en: 'Kennel I', fa: 'لانهٔ سگ ۱', size: 10 }, { en: 'Kennel II', fa: 'لانهٔ سگ ۲', size: 10 },
  { en: 'Night Shift I', fa: 'شیفت شب ۱', size: 10 }, { en: 'Night Shift II', fa: 'شیفت شب ۲', size: 10 },
  { en: 'Fuse Box I', fa: 'تابلو برق ۱', size: 10 }, { en: 'Fuse Box II', fa: 'تابلو برق ۲', size: 10 },
  { en: 'Glass House I', fa: 'خانهٔ شیشه‌ای ۱', size: 10 }, { en: 'Glass House II', fa: 'خانهٔ شیشه‌ای ۲', size: 10 },
];
const chapStart = CHAPTERS.map((_, i) => CHAPTERS.slice(0, i).reduce((n, c) => n + c.size, 0));
const chapterOf = i => { let ci = 0; while (ci + 1 < CHAPTERS.length && i >= chapStart[ci + 1]) ci++; return ci; };    // level index -> chapter index
/* Star gate: to enter a chapter the player needs a share of ALL the stars that the earlier levels can give. The share rises from 50 % at the first gate
   (an average of 1.5 stars per level, gentle while the player is still deciding to stay) to 70 % at the last one (more than 2 stars on average; 2/3 is
   reached around chapter 14). A star tier is about 2 actions over par for 2 stars, so 2 stars on average is a solid but fair run. */
const GATE_FROM = 0.5, GATE_TO = 0.7;
const gateShare = ci => GATE_FROM + (GATE_TO - GATE_FROM) * (ci - 1) / (CHAPTERS.length - 2);

const PROGRESS_V = 2;

const newIdOf = o => o >= 16 ? o - 9 : (OLD_TO_NEW[o] || 0);
function upgradeBest(b) { const out = {}; for (const k of Object.keys(b || {})) { const n = newIdOf(Number(k)); if (n && (!out[n] || b[k].stars > out[n].stars || (b[k].stars === out[n].stars && b[k].moves < out[n].moves))) out[n] = b[k]; } return out; }

  store.set('pb_best3', upgradeBest(store.get('pb_best3', {}))); const lastOld = store.get('pb_last', 0), nn = newIdOf(lastOld + 1);
  store.set('pb_last', nn ? nn - 1 : 0); store.set('pb_pv', PROGRESS_V);
}

let acct = { loggedIn: false, email: '', username: '', saved: 0 };            // the signed-in player, if any (see the Account section)

const chapterLocked = ci => !settings.unlockAll && ci > 0 && starsBefore(ci) < chapNeed(ci);
const levelLocked = i => chapterLocked(chapterOf(i));
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!levelLocked(i) && !best[LEVELS[i].id]) return i; return Math.max(0, LEVELS.length - 1); }

/* All sounds are synthesised with WebAudio (no audio files); the context starts on the first touch. See docs/sound-design.md. */
const Sfx = (() => {
  let ac = null, master = null;
  const get = () => {
    if (ac === null) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = settings.vol / 100 * .8; master.connect(ac.destination); } catch (e) { ac = false; } }
    if (ac && ac.state !== 'running' && ac.state !== 'closed') ac.resume();
    return ac;
  };
  const tone = (a, t, f0, f1, dur, type, vol, delay = 0, lp = 0) => {
    const o = a.createOscillator(), g = a.createGain(); let out = o;
    o.type = type; o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + delay + dur);
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); out = f; }
    g.gain.setValueAtTime(0.0001, t + delay); g.gain.exponentialRampToValueAtTime(vol, t + delay + .008); g.gain.exponentialRampToValueAtTime(.0001, t + delay + dur);
    out.connect(g); g.connect(master); o.start(t + delay); o.stop(t + delay + dur + .02);
  };
  const noise = (a, t, dur, vol, delay = 0, hp = 1500) => {
    const n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t + delay);
  };
  const S = {
    click: (a, t) => tone(a, t, 900, 700, .03, 'square', .04),
    step: (a, t) => { tone(a, t, 150 + Math.random() * 25, 90, .06, 'triangle', .13); noise(a, t, .03, .03, 0, 3000); },
    /* a camera turning: a motor click, a thin servo whine, two detent ticks and a lock-in thunk with a small ping (no low buzzing sweep, which sounded rude) */
    cam: (a, t) => { noise(a, t, .025, .06, 0, 2800); tone(a, t, 640, 940, .11, 'triangle', .05, .01, 2600); noise(a, t, .02, .045, .045, 3200); noise(a, t, .02, .045, .095, 3200); tone(a, t, 260, 120, .07, 'sine', .1, .12); tone(a, t, 1760, 1760, .03, 'square', .03, .125); },
    guardStep: (a, t) => { tone(a, t, 130, 55, .14, 'sine', .3); noise(a, t, .05, .05, 0, 2000); },

    panel: (a, t) => { tone(a, t, 1200, 180, .12, 'square', .07, 0, 2500); noise(a, t, .06, .06, 0, 3500); tone(a, t, 90, 60, .12, 'sine', .2, .06); },

    refuse: (a, t) => { tone(a, t, 110, 100, .2, 'square', .09, 0, 700); tone(a, t, 117, 104, .2, 'square', .07, 0, 700); },
    siren: (a, t) => { for (let i = 0; i < 4; i++) { tone(a, t, 520, 940, .17, 'sawtooth', .075, i * .3, 3000); tone(a, t, 940, 520, .13, 'sawtooth', .075, i * .3 + .17, 3000); } tone(a, t, 70, 60, .5, 'sine', .22); },

    caught: (a, t) => { tone(a, t, 440, 90, .55, 'sawtooth', .1, 0, 1400); tone(a, t, 90, 50, .3, 'sine', .3, .45); },
    win: (a, t) => { [523, 659, 784, 1047].forEach((f, i) => tone(a, t, f, f, .16, 'triangle', .13, i * .09)); tone(a, t, 2093, 2093, .35, 'sine', .05, .4); },

    play(name) {
      if (settings.vibrate && BUZZ[name] && navigator.vibrate) { try { navigator.vibrate(BUZZ[name]); } catch (e) {} }

    context() { return get(); },
    /* renders one effect offline (a tool for listening to it in a file; nothing plays) */
    async preview(name, ms = 600) { const sr = 44100, off = new OfflineAudioContext(1, Math.floor(sr * ms / 1000), sr), prev = master; master = off.createGain(); master.gain.value = .8; master.connect(off.destination); try { S[name](off, 0); return await off.startRendering(); } finally { master = prev; } },
    volume() { if (master) master.gain.value = settings.vol / 100 * .8; },
  };
})();

/* ---------------------------------------------------------------- music */
/* A tiptoe loop played by the same synth: a bouncing octave bass with gaps, a staccato lead that wiggles by a semitone and answers itself, wood-block ticks and a soft kick.
   16 bars of 8 eighth-notes in A minor at 112 BPM (about 34 seconds), then it loops. It is original, written for this game.
   The pattern is plain data below; schedule() is also used to render a preview file offline. */
const Music = (() => {
  const BPM = 108, STEP = 60 / BPM / 2;
  const midi = n => { const m = /^([A-G])([#b]?)(\d)$/.exec(n); return { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) + 1) * 12; };

  const R = null;
  /* "Tiptoe": a bouncing octave bass that leaves gaps (the creeping), and a short staccato lead that wiggles a semitone and answers itself. 16 bars, A minor. */
  const LEAD = [
    ['A4', R, 'C5', R, 'B4', 'Bb4', 'A4', R], [R, R, 'E4', 'G4', 'A4', R, R, R], ['D5', R, 'F5', R, 'E5', 'Eb5', 'D5', R], [R, R, 'A4', 'C5', 'D5', R, R, R],
    ['A4', R, 'C5', R, 'B4', 'Bb4', 'A4', R], [R, R, 'E4', 'G4', 'A4', R, 'G#4', R], ['B4', R, 'D5', R, 'C5', 'B4', 'G#4', R], ['E4', R, R, R, 'G#4', R, 'B4', R],
    ['A4', 'A4', R, 'A4', R, 'C5', R, 'E5'], ['D5', R, 'C5', R, 'B4', R, 'A4', R], ['F4', 'F4', R, 'F4', R, 'A4', R, 'D5'], ['C5', R, 'Bb4', R, 'A4', R, 'F4', R],
    ['A4', R, 'C5', R, 'F5', R, 'E5', 'C5'], ['B4', R, 'G#4', R, 'E4', R, 'G#4', 'B4'], ['A4', R, 'C5', 'B4', 'Bb4', 'A4', R, R], ['E4', R, R, 'A4', R, R, R, R],
  ];
  const CH = ['Am', 'Am', 'Dm', 'Dm', 'Am', 'Am', 'E', 'E', 'Am', 'Am', 'Dm', 'Dm', 'F', 'E', 'Am', 'Am'];
  const BASS = { Am: ['A2', R, R, 'A3', R, 'A2', R, 'E3'], Dm: ['D2', R, R, 'D3', R, 'D2', R, 'A2'], E: ['E2', R, R, 'E3', R, 'E2', R, 'B2'], F: ['F2', R, R, 'F3', R, 'F2', R, 'C3'] };

  const osc = (a, dest, t, f0, f1, dur, type, vol, lp) => {
    const o = a.createOscillator(), g = a.createGain(); let out = o;
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); out = f; }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    out.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .02);
  };
  const tick = (a, dest, t, dur, vol, hp) => {
    const n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(dest); s.start(t);
  };
  function schedule(a, dest, step, t) {
    const bar = Math.floor(step / 8) % LEAD.length, pos = step % 8, swing = (pos & 1) ? STEP * .1 : 0, tt = t + swing;
    const lead = LEAD[bar][pos], bass = BASS[CH[bar]][pos];
    if (bass) osc(a, dest, tt, hz(bass), hz(bass) * .98, .2, 'triangle', .16);                               // plucked bass
    if (lead) { osc(a, dest, tt, hz(lead), hz(lead), .12, 'square', .045, 2200); osc(a, dest, tt + STEP * 1.5, hz(lead), hz(lead), .1, 'square', .018, 1800); }   // staccato lead and its echo

  }

  function want() { return settings.music && settings.musicVol > 0 && !document.hidden && !cgMuted(); }
  function ensure() {
    const a = Sfx.context(); if (!a) return null;
    if (a !== ctx_) { ctx_ = a; gain = a.createGain(); gain.connect(a.destination); }

    if (alarm) { ctx.fillStyle = '#ff3b52'; ctx.font = `900 ${cs * .38}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText('!', cx, fy - cs * 1.18 - bob); }
  };
  const drawDog = j => {
    const q = ddraw[j], cx = FX(q.x + .5), fy = FY(q.y) + cellH * .86, frm = q.moving ? 1 + (Math.floor(now / 90) % 2) : 0;
    shadow(cx, fy, cs * .3); drawSprite(dogSprite(frm), cx, fy, sc * 1.05, q.f === 1, glowFor(dogBase() + j, pulse));
    if (alarm && alarm.who.has(dogBase() + j)) bangMark(cx, fy - cs * .75);
  };
  const dogsAt = y => L.dogs.forEach((o, j) => { if (Math.round(ddraw[j].y) === y) drawDog(j); });
  const guardsAt = y => L.guards.forEach((g, j) => { if (Math.round(gdraw[j].y) === y) drawGuard(j, false); });
  const thiefAt = y => { if (thiefRow === y) drawThief(false); };
  const togAt = new Map(); L.toggles.forEach((t, j) => togAt.set(t.c, nCam() + nGuard() + j));
  for (let y = 0; y < L.h; y++) {
    for (let x = 0; x < L.w; x++) {
      const c = y * L.w + x;
      if (L.wall[c]) {
        drawWall(x, y);
        const k = L.cams.findIndex(q => q.c === c);
        if (k >= 0) { const d = dg[k], cx = FX(x + .5), cy = FY(y) - wallH + cellH * .72;
          drawSprite(camSprite(d === 3 ? 1 : d), cx, cy, cs * .05, d === 3, glowFor(k, pulse));
          const lens = d === 1 ? 4.5 : d === 3 ? -4.5 : 0;
          lensOf.set(k, [cx + lens * cs * .05, cy - cs * .3]);
          if (coneOn && !chainWho.has(k)) cameraBeam(camOf.get(k), cx + lens * cs * .05, cy - cs * .3, pulse);
          if (alarm && alarm.who.has(k)) bangMark(cx, cy - cs * .5); }
        const pj = L.panels.findIndex(q => q.c === c);
        if (pj >= 0) { const k = panelBase() + pj, cx = FX(x + .5), cy = FY(y) - wallH + cellH * .72;
          drawSprite(panelSprite(PANEL_COL[pj % 3]), cx, cy, cs * .05, false, glowFor(k, pulse)); }
        const li = L.lights.findIndex(q => q.c === c);
        if (li >= 0) { const k = lightBase() + li, d = dg[k], cx = FX(x + .5), cy = FY(y) - wallH + cellH * .72;
          drawSprite(lampSprite(d === 3 ? 1 : d), cx, cy, cs * .05, d === 3, glowFor(k, pulse));
          const lens = d === 1 ? 4.5 : d === 3 ? -4.5 : 0, ly = cy - cs * .3;
          lensOf.set(k, [cx + lens * cs * .05, ly]);
          if (coneOn && !chainWho.has(k)) cameraBeam(camOf.get(k), cx + lens * cs * .05, ly, pulse);
          if (alarm && alarm.who.has(k)) bangMark(cx, cy - cs * .5);
          const nr = nextRays.get(k); if (nr) ghostBeam(nr, cx + (nr.d === 1 ? 4.5 : nr.d === 3 ? -4.5 : 0) * cs * .05, ly); }
      } else if (L.glass[c]) {
        drawGlass(x, y, pulse);
      } else if (togAt.has(c)) {
        const k = togAt.get(c), t = L.toggles[k - nCam() - nGuard()];
        if (t.kind === 'mirror') { drawMirror(x, y, dg[k], k, pulse); if (coneOn && mirrorsHit.has(c)) mirrorHit(x, y, pulse); blockGlow(x, y, k, pulse); }
        else if (dg[k] === 1) { drawDoorClosed(x, y); blockGlow(x, y, k, pulse); }
        else drawDoorOpen(x, y, k, pulse);
      }
    }
    guardsAt(y); if (alarm) { thiefAt(y); dogsAt(y); } else { dogsAt(y); thiefAt(y); }          // a charging dog is drawn in front of him
  }
  if (coneOn) { e.rays.forEach(r => { if (chainWho.has(r.who)) mirrorBeam(r, lensOf.get(r.who), pulse); }); mirrorsHit.forEach((d, c) => mirrorFlare(c % L.w, (c / L.w) | 0, d)); }
  // wires: a coloured dashed line from each panel to the things it drives, and a coloured badge on each of them
  const topCentre = c => [FX(c % L.w + .5), FY((c / L.w) | 0) - wallH + cellH * .5];
  L.panels.forEach((pn, j) => {
    const col = PANEL_COL[j % 3], k = panelBase() + j, [px0, py0] = topCentre(pn.c);
    pn.links.forEach(i => {
      const cell = watcherCell(i), open = kindOf(i) === 'door' && dg[i] === 0, [qx, qy] = open ? [FX(cell % L.w + .5), FY((cell / L.w) | 0) + cellH * .5] : topCentre(cell);
      ctx.strokeStyle = col; ctx.globalAlpha = sel === k ? .95 : .5; ctx.lineWidth = sel === k ? 2.5 : 1.6; ctx.setLineDash([cs * .08, cs * .07]);
      ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(qx, py0); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      const bs = Math.max(5, cs * .15), bx = FX(cell % L.w) + cs - bs - 2, by = (open ? FY((cell / L.w) | 0) : FY((cell / L.w) | 0) - wallH) + 2;
      ctx.fillStyle = '#16101f'; ctx.fillRect(bx - 1, by - 1, bs + 2, bs + 2); ctx.fillStyle = col; ctx.fillRect(bx, by, bs, bs);
      if (sel === k) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = .4 + .6 * pulse; ctx.strokeRect(FX(cell % L.w) - 1, (open ? FY((cell / L.w) | 0) : FY((cell / L.w) | 0) - wallH) - 1, cs + 2, cellH + (open ? 0 : wallH) + 2); ctx.globalAlpha = 1; }
    });
  });
  ctx.restore();
  if (alarm && !soft) {                                                                     // red alarm light over the whole board
    const a = .1 + .16 * (coneOn ? 1 : .3), g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
    g.addColorStop(0, 'rgba(255,20,50,0)'); g.addColorStop(1, `rgba(255,20,50,${a + .2})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}
setFavicon(); applyLang(); syncSettingsUI();
load(store.get('pb_last', 0)); toMenu(); requestAnimationFrame(frame);
{ const fromLink = /[?&]loggedin=1/.test(location.search); if (fromLink && history.replaceState) history.replaceState(null, '', location.pathname); renderAccount(); refreshAccount(fromLink); }
