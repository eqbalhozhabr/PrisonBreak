<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Blind Eye</title>
<style>
  :root { color-scheme:dark; --bg:#0d1017; --panel:#161b26; --ink:#e8ecf4; --mute:#8b94a8; --red:#ff3b52; --gold:#ffc54a; --ok:#41d392; --line:#262d3d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #app { height:100%; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:8px; padding:8px 0 4px; }
  header .ttl { flex:1; min-width:0; font-size:13px; color:var(--mute); line-height:1.35; }
  header .ttl b { color:var(--ink); font-size:15px; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; min-height:42px; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.38; cursor:default; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  button.on { border-color:var(--red); color:var(--red); }
  button.big { width:100%; min-height:50px; font-size:17px; }
  #stats { display:flex; gap:8px; font-size:13px; color:var(--mute); padding-bottom:2px; align-items:center; flex-wrap:wrap; }
  #stats b { color:var(--ink); font-size:16px; }
  #hearts { letter-spacing:2px; font-size:16px; direction:ltr; }
  #hearts .off { color:#3a4052; } #hearts .on { color:var(--red); }
  #tip { font-size:13px; color:var(--mute); min-height:36px; padding:2px 0 4px; line-height:1.5; }
  #tip.warn { color:var(--red); } #tip.good { color:var(--ok); }
  #stage { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; border-radius:12px; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px 0 12px; direction:ltr; }
  #bar .sep { width:1px; background:var(--line); margin:0 4px; }
  #bar button { min-width:48px; }
  .overlay { position:fixed; inset:0; background:rgba(5,7,12,.86); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .overlay.on { display:flex; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; max-width:460px; width:100%; text-align:center; max-height:94%; overflow:auto; }
  .card h2 { margin:0 0 8px; }
  .stars { font-size:34px; letter-spacing:6px; color:var(--gold); margin:6px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:6px 0 10px; direction:ltr; }
  .grid button { padding:8px 0; min-height:46px; } .grid button small { display:block; color:var(--gold); font-size:10px; min-height:12px; }
  .chap { font-size:13px; color:var(--mute); margin-top:10px; display:flex; justify-content:space-between; gap:8px; text-align:start; }
  .chap b { color:var(--ink); }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .col { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .muted { color:var(--mute); font-size:12px; margin-top:8px; line-height:1.6; }
  #adCount { font-size:34px; font-weight:700; margin:10px 0; }
  /* main menu */
  #menu { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; background:radial-gradient(circle at 50% 28%, #1c2433 0%, #0d1017 62%); }
  #menu.on { display:flex; }
  #menu .logo { width:128px; height:128px; }
  #menu h1 { margin:0; font-size:44px; letter-spacing:.14em; text-transform:uppercase; line-height:1; text-align:center; }
  #menu h1 span { color:var(--red); }
  #menu .tag { color:var(--mute); font-size:14px; text-align:center; max-width:300px; line-height:1.6; }
  #menu .col { width:100%; max-width:320px; margin-top:6px; }
  #menu .foot { color:#566079; font-size:11px; position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); }
  /* settings */
  .set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); text-align:start; }
  .set:last-of-type { border-bottom:0; }
  .set label { font-size:15px; } .set small { display:block; color:var(--mute); font-size:11px; margin-top:2px; }
  .seg { display:flex; gap:6px; } .seg button { min-height:38px; padding:6px 12px; }
  .seg button.sel { background:var(--red); border-color:var(--red); color:#fff; }
  .tog { min-width:64px; } input[type=range] { width:120px; accent-color:#ff3b52; }
  .howl { text-align:start; line-height:1.7; font-size:14px; color:var(--ink); padding-inline-start:18px; margin:8px 0; }
  .howl li { margin-bottom:6px; }
</style>

<script>
/* Blind Eye: rules, exact solver, and the level generator.
 *
 * Rules
 *  - Grid with walls. The thief starts on S and must reach E.
 *  - Cameras sit in wall cells and face N/E/S/W. One action turns a camera 90 degrees either way.
 *  - Guards stand on a straight rail of floor cells. One action steps a guard along its rail (it keeps
 *    facing the way it faced) or flips it around. A guard sees `range` cells ahead.
 *  - Doors (floor cells) open or close with one action. A closed door blocks movement and sight.
 *  - Mirrors (floor cells, pillars) flip between "/" and "\" with one action and bend any sight line
 *    that reaches them by 90 degrees.
 *  - Walls, guards and closed doors stop sight. Guards, closed doors and mirrors block movement.
 *  - The thief may stand only on dark cells. Walking is free; only actions on watchers/objects count.
 *    An action is illegal if it lights the thief's cell (he picks the best cell in his dark region
 *    before each action).
 *  - Par = the fewest actions, by exact search.
 *
 * Cameras only turn clockwise (a 270 degree turn costs 3). Every other action can be undone by one action.
 * The generator searches backwards from "the exit is reachable" over the whole state graph, which gives the
 * par of every possible starting state at once.
 */
(function () {
'use strict';
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const MIRROR = [[1, 0, 3, 2], [3, 2, 1, 0]];       // state 0 = "/", state 1 = "\"; indexed by travel direction

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(a, b) { let h = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x7F4A7C15, 0xC2B2AE35); h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; return h >>> 0; }

/* level = { w,h, wall:Uint8Array, S, E, cams:[{c,d}], guards:[{rail:[cells], i, f, range}], toggles:[{c, kind:'door'|'mirror', s}] }
   digits: cameras (facing 0..3), guards (i*2+f), toggles (0/1: door 1 = closed, mirror 0 = "/" 1 = "\"). */
let L_W = 0;
function prepare(L) { L_W = L.w; }
const counts = L => [L.cams.length, L.guards.length, (L.toggles || []).length];
function radices(L) {
  return L.cams.map(() => 4).concat(L.guards.map(g => g.rail.length * 2), (L.toggles || []).map(() => 2));
}
function initialDigits(L) {
  return L.cams.map(c => c.d).concat(L.guards.map(g => g.i * 2 + g.f), (L.toggles || []).map(t => t.s));
}
function guardFacingDir(g, f) {            // direction index the guard looks (f=0 toward the last rail cell)
  const w = L_W, a = g.rail[0], b = g.rail[g.rail.length - 1];
  const ax = a % w, ay = (a / w) | 0, bx = b % w, by = (b / w) | 0;
  const d = ax === bx ? (by > ay ? 2 : 0) : (bx > ax ? 1 : 3);
  return f === 0 ? d : (d + 2) % 4;
}

/* Lit cells + blocked cells for one configuration. With wantRays it also returns the sight-line
   segments (a mirror starts a new segment) so the renderer can draw cones. */
function evalConfig(L, digits, wantRays) {
  const { w, h, wall } = L, n = w * h, [nc, ng] = counts(L), tog = L.toggles || [];
  const lit = new Uint8Array(n), occ = new Uint8Array(n), opq = new Uint8Array(n), mir = new Int8Array(n).fill(-1);
  const gpos = L.guards.map((g, k) => g.rail[digits[nc + k] >> 1]);
  for (const c of gpos) { occ[c] = 1; opq[c] = 1; }
  tog.forEach((t, j) => {
    const v = digits[nc + ng + j];
    if (t.kind === 'door') { if (v === 1) { occ[t.c] = 1; opq[t.c] = 1; } }
    else { occ[t.c] = 1; mir[t.c] = v; }
  });
  const rays = wantRays ? [] : null;
  const cast = (start, d0, range, who) => {
    let d = d0, x = start % w, y = (start / w) | 0, cur = { src: start, d, cells: [], who, first: true };
    const segs = [];
    for (let s = 0; s < range; s++) {
      x += DX[d]; y += DY[d];
      if (x < 0 || y < 0 || x >= w || y >= h) break;
      const c = y * w + x;
      if (wall[c]) break;
      if (mir[c] >= 0) { segs.push(cur); d = MIRROR[mir[c]][d]; cur = { src: c, d, cells: [], who, first: false }; continue; }
      if (opq[c]) break;
      lit[c] = 1; cur.cells.push(c);
    }
    segs.push(cur);
    if (rays) for (const sg of segs) rays.push(sg);
  };
  L.cams.forEach((cm, k) => cast(cm.c, digits[k], 99, k));
  L.guards.forEach((g, k) => cast(gpos[k], guardFacingDir(g, digits[nc + k] & 1), g.range, nc + k));
  return { lit, occ, rays };
}

/* dark, free regions of one configuration */
function labelConfig(L, dg) {
  const { w, h, wall } = L, n = w * h, { lit, occ } = evalConfig(L, dg, false), lab = new Int8Array(n).fill(-1);
  let k = 0;
  const st = [];
  for (let s = 0; s < n; s++) {
    if (wall[s] || lit[s] || occ[s] || lab[s] >= 0) continue;
    st.push(s); lab[s] = k;
    while (st.length) {
      const c0 = st.pop(), x = c0 % w, y = (c0 / w) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const q = ny * w + nx;
        if (wall[q] || lit[q] || occ[q] || lab[q] >= 0) continue;
        lab[q] = k; st.push(q);
      }
    }
    k++;
  }
  return { lab, k };
}

/* every single action from a configuration: [newDigits, which watcher] */
function actions(L, dg) {
  const [nc, ng] = counts(L), out = [];
  L.cams.forEach((cm, k) => { const d2 = dg.slice(); d2[k] = (dg[k] + 1) % 4; out.push([d2, k]); });   // clockwise only
  L.guards.forEach((g, j) => {
    const k = nc + j, v = dg[k], i = v >> 1, f = v & 1;
    const taken = ni => L.guards.some((o, q) => q !== j && o.rail[dg[nc + q] >> 1] === g.rail[ni]);
    for (const s of [1, -1]) {
      const ni = i + s;
      if (ni < 0 || ni >= g.rail.length || taken(ni)) continue;
      const d2 = dg.slice(); d2[k] = ni * 2 + f; out.push([d2, k]);
    }
    const d2 = dg.slice(); d2[k] = i * 2 + (1 - f); out.push([d2, k]);
  });
  (L.toggles || []).forEach((t, j) => {
    const k = nc + ng + j, d2 = dg.slice(); d2[k] = 1 - dg[k]; out.push([d2, k]);
  });
  return out;
}

/* Exact BFS over (configuration, dark region the thief is in). opts: digits/thief to start elsewhere. */
function solve(L, opts) {
  prepare(L);
  const n = L.w * L.h, rad = radices(L);
  let total = 1; for (const r of rad) total *= r;
  if (total > 2.5e6) return null;
  const mul = new Array(rad.length); { let m = 1; for (let i = rad.length - 1; i >= 0; i--) { mul[i] = m; m *= rad[i]; } }
  const encode = d => d.reduce((s, v, i) => s + v * mul[i], 0);
  const decode = id => rad.map((r, i) => ((id / mul[i]) | 0) % r);
  const cache = new Map();
  const comps = id => { let c = cache.get(id); if (!c) { c = labelConfig(L, decode(id)); cache.set(id, c); } return c; };

  const start = encode((opts && opts.digits) || initialDigits(L));
  const S0 = opts && opts.thief != null ? opts.thief : L.S;
  const c0 = comps(start);
  if (S0 < 0 || c0.lab[S0] < 0) return { solvable: false, reason: 'start lit' };
  if (L.E < 0) return { solvable: false, reason: 'no exit' };
  const frozen = opts && opts.frozen;
  const key = (id, k) => id * 16 + k;
  const dist = new Map(), par = new Map();
  let frontier = [[start, c0.lab[S0]]], goal = null, depth = 0;
  dist.set(key(start, c0.lab[S0]), 0);
  if (c0.lab[L.E] === c0.lab[S0]) goal = key(start, c0.lab[S0]);
  while (frontier.length && goal === null) {
    const next = [];
    depth++;
    for (const [id, k] of frontier) {
      const cur = comps(id);
      for (const [d2, who] of actions(L, decode(id))) {
        if (frozen && frozen.has(who)) continue;
        const id2 = encode(d2), nc2 = comps(id2), seen = new Set();
        for (let x = 0; x < n; x++) {
          if (cur.lab[x] !== k) continue;
          const k2 = nc2.lab[x];
          if (k2 < 0 || seen.has(k2)) continue;
          seen.add(k2);
          const kk = key(id2, k2);
          if (dist.has(kk)) continue;
          dist.set(kk, depth); par.set(kk, [key(id, k), who]);
          next.push([id2, k2]);
          if (nc2.lab[L.E] === k2) goal = kk;
        }
      }
      if (goal !== null) break;
    }
    frontier = next;
    if (depth > (opts && opts.maxDepth || 60)) break;
  }
  if (goal === null) return { solvable: false, explored: dist.size };
  const who = [], ids = [];
  let kk = goal;
  while (par.has(kk)) { const [p, wh] = par.get(kk); ids.push(Math.floor(kk / 16)); who.push(wh); kk = p; }
  ids.reverse(); who.reverse();
  return { solvable: true, par: depth, explored: dist.size, configs: ids.map(decode), who, rad };
}

/* ASCII of a configuration: # wall . dark ~ lit, S/E, arrows = cameras, a-d guards, X/x doors, / \ mirrors */
function draw(L, digits) {
  prepare(L);
  const { lit } = evalConfig(L, digits, false), [nc, ng] = counts(L), ar = ['^', '>', 'v', '<'];
  let s = '';
  for (let y = 0; y < L.h; y++) {
    for (let x = 0; x < L.w; x++) {
      const c = y * L.w + x;
      let ch = L.wall[c] ? '#' : lit[c] ? '~' : '.';
      if (c === L.S) ch = lit[c] ? '!' : 'S';
      if (c === L.E) ch = lit[c] ? 'e' : 'E';
      const cam = L.cams.findIndex(q => q.c === c);
      if (cam >= 0) ch = ar[digits[cam]];
      L.guards.forEach((g, k) => { if (g.rail[digits[nc + k] >> 1] === c) ch = 'abcd'[k]; });
      (L.toggles || []).forEach((t, j) => { if (t.c === c) ch = t.kind === 'door' ? (digits[nc + ng + j] ? 'X' : 'x') : (digits[nc + ng + j] ? '\\' : '/'); });
      s += ch;
    }
    s += '\n';
  }
  return s;
}

/* ASCII level format: # wall, . floor, S start, E exit, ^ > v < camera (on a wall cell), a..d guard rail cells,
   X closed door, x open door, / \ mirror. meta.guards: {a:{i,f,range}} start index on the rail, facing, range. */
function parseLevel(map, meta) {
  const h = map.length, w = map[0].length, wall = new Uint8Array(w * h);
  const L = { w, h, wall, S: -1, E: -1, cams: [], guards: [], toggles: [] };
  const rails = {};
  map.forEach((row, y) => {
    if (row.length !== w) throw new Error('ragged map row ' + y);
    [...row].forEach((ch, x) => {
      const c = y * w + x;
      if (ch === '#') wall[c] = 1;
      else if (ch === 'S') L.S = c;
      else if (ch === 'E') L.E = c;
      else if ('^>v<'.includes(ch)) { wall[c] = 1; L.cams.push({ c, d: '^>v<'.indexOf(ch) }); }
      else if (/[a-d]/.test(ch)) (rails[ch] = rails[ch] || []).push(c);
      else if (ch === 'X' || ch === 'x') L.toggles.push({ c, kind: 'door', s: ch === 'X' ? 1 : 0 });
      else if (ch === '/' || ch === '\\') L.toggles.push({ c, kind: 'mirror', s: ch === '/' ? 0 : 1 });
    });
  });
  Object.keys(rails).sort().forEach(k => {
    const g = Object.assign({ i: 0, f: 0, range: 3 }, (meta && meta.guards || {})[k]);
    g.rail = rails[k].sort((a, b) => a - b);
    L.guards.push(g);
  });
  return L;
}
function toMap(L) {
  const rows = [], ar = ['^', '>', 'v', '<'];
  for (let y = 0; y < L.h; y++) {
    let r = '';
    for (let x = 0; x < L.w; x++) {
      const c = y * L.w + x;
      let ch = L.wall[c] ? '#' : '.';
      if (c === L.S) ch = 'S';
      if (c === L.E) ch = 'E';

    cam: (a, t) => { tone(a, t, 170, 330, .2, 'sawtooth', .07, 0, 900); tone(a, t, 1300, 1300, .02, 'square', .05, .2); },
    guardStep: (a, t) => { tone(a, t, 130, 55, .14, 'sine', .3); noise(a, t, .05, .05, 0, 2000); },
    turn: (a, t) => { tone(a, t, 520, 330, .07, 'square', .05); tone(a, t, 400, 300, .07, 'square', .05, .08); noise(a, t, .12, .03, 0, 4000); },

    mirror: (a, t) => { tone(a, t, 1900, 2600, .1, 'sine', .07); tone(a, t, 2600, 3100, .08, 'sine', .04, .05); },
    refuse: (a, t) => { tone(a, t, 110, 100, .2, 'square', .09, 0, 700); tone(a, t, 117, 104, .2, 'square', .07, 0, 700); },
    spotted: (a, t) => { for (let i = 0; i < 4; i++) tone(a, t, i % 2 ? 660 : 880, i % 2 ? 660 : 880, .09, 'square', .07, i * .1, 2400); },
    caught: (a, t) => { tone(a, t, 440, 90, .55, 'sawtooth', .1, 0, 1400); tone(a, t, 90, 50, .3, 'sine', .3, .45); },
    win: (a, t) => { [523, 659, 784, 1047].forEach((f, i) => tone(a, t, f, f, .16, 'triangle', .13, i * .09)); tone(a, t, 2093, 2093, .35, 'sine', .05, .4); },
    hint: (a, t) => { tone(a, t, 1318, 1318, .45, 'sine', .1); tone(a, t, 1976, 1976, .35, 'sine', .05, .02); },
    undo: (a, t) => tone(a, t, 520, 280, .09, 'triangle', .1),

  };
})();

}

/* ------------------------------------------------------------- actions */
function options(k) {

/* Walking is free in the puzzle. In hearts mode a lit tile may be crossed; the search then prefers shadows. */

  if (!L) return;

let last = performance.now();

function draw(now) {
  ctx.clearRect(0, 0, W, H); if (!L) return;
  P.prepare(L);
  const calm = settings.reduceMotion, e = P.evalConfig(L, dg, true), sx = shake && !calm ? Math.sin(now / 25) * 4 * shake : 0, pulse = calm ? .6 : .5 + .5 * Math.sin(now / 280);
  const camOf = new Map(); e.rays.forEach(r => { if (r.first && r.who < nCam()) camOf.set(r.who, r); });

  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (!L.wall[y * L.w + x]) drawFloor(x, y);

    ctx.strokeStyle = 'rgba(160,190,255,.28)'; ctx.lineWidth = Math.max(2, cs * .07); ctx.lineCap = 'round'; ctx.setLineDash([cs * .08, cs * .14]);
    ctx.beginPath(); g.rail.forEach((c, i) => { const px = FX(c % L.w + .5), py = FY(((c / L.w) | 0) + .5); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); ctx.setLineDash([]);
  });
  { const x = L.E % L.w, y = (L.E / L.w) | 0, px = FX(x), py = FY(y);                         // exit
    ctx.fillStyle = `rgba(65,211,146,${.22 + .12 * pulse})`; ctx.fillRect(px, py, cs, cellH);
    ctx.fillStyle = '#0f3d2a'; ctx.fillRect(px + cs * .14, py + cellH * .06, cs * .72, cellH * .56);
    ctx.fillStyle = '#41d392'; for (let i = 0; i < 5; i++) ctx.fillRect(px + cs * .2 + i * cs * .13, py + cellH * .1, cs * .06, cellH * .48);
    ctx.fillStyle = '#d9fff0'; ctx.font = `800 ${cs * .17}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EXIT', px + cs / 2, py + cellH * .33); }

    const k = calm ? 1 : .3; q.x += (tx - q.x) * k; q.y += (ty - q.y) * k; if (Math.abs(tx - q.x) < .01) q.x = tx; if (Math.abs(ty - q.y) < .01) q.y = ty;

  };

    const cx = FX(tfx + .5), fy = FY(tfy) + cellH * .86, bob = frameIdx ? Math.abs(Math.sin(now / 110 * Math.PI)) * cs * .06 : 0, spr = person('thief', thiefDir === 3 ? 1 : thiefDir, frameIdx);
    if (ghost) { ctx.save(); ctx.globalAlpha = .4; drawSprite(spr, cx, fy - bob, sc, thiefDir === 3); ctx.restore(); return; }

  };
