<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Blind Eye</title>
<style>
  /* pixel UI: Silkscreen for labels, Press Start 2P for the title and numbers, paragraphs stay in the system font for reading.
     Fonts are SIL OFL; tools/build-single.js inlines them. Boxes are drawn with stepped box-shadows, so corners are cut, not rounded. */
  @font-face { font-family:'Silkscreen'; font-weight:400; font-display:swap; src:url(fonts/silkscreen-400.ttf) format('truetype'); }
  @font-face { font-family:'Silkscreen'; font-weight:700; font-display:swap; src:url(fonts/silkscreen-700.ttf) format('truetype'); }
  @font-face { font-family:'Press Start 2P'; font-weight:400; font-display:swap; src:url(fonts/press-start-2p.woff2) format('woff2'); }
  :root { color-scheme:dark; --pf:'Silkscreen','Courier New',monospace; --tf:'Press Start 2P','Silkscreen','Courier New',monospace;
    --bg:#0d1017; --panel:#1b2130; --panel2:#262e42; --edge:#06080d; --hi:#3d4863; --lo:#0f131c; --ink:#e8ecf4; --mute:#8b94a8;
    --red:#ff3b52; --red-hi:#ff8795; --red-lo:#a81c30; --gold:#ffc54a; --ok:#41d392; --line:#2a3246; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #app { height:100%; height:100dvh; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
  /* the pixel box: 3px edge without corners, light top, dark bottom */
  button, .card, .hud, .pix { --h:var(--hi); --l:var(--lo); --e:var(--edge);
    box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--h), inset 0 -3px 0 0 var(--l); border-radius:0; }
  button { font-family:var(--pf); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--panel2); border:0; padding:10px 14px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; margin:3px; }
  button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--l), inset 0 -3px 0 0 var(--h); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  button.on { color:var(--red-hi); --e:var(--red-lo); }
  button.big { width:100%; min-height:54px; font-size:14px; margin:0; }
  .ic { display:inline-block; flex:none; background:currentColor; -webkit-mask:var(--m) center/100% 100% no-repeat; mask:var(--m) center/100% 100% no-repeat; image-rendering:pixelated; }
  .ic.rot90 { transform:rotate(90deg); } .ic.flipx { transform:scaleX(-1); } .ic.gold { color:var(--gold); } .ic.dim { color:#394156; } .ic.red { color:var(--red); }
  /* HUD */
  .hud { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:10px 4px 10px; padding:9px 10px; background:var(--panel); }
  .hud button.sq { min-height:40px; width:40px; padding:0; margin:0; }
  .hud .lv { flex:1; min-width:0; }
  .hud .lv b { display:block; font-family:var(--pf); font-size:14px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .lv span { display:block; font-family:var(--pf); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .stat { text-align:center; min-width:46px; }
  .hud .stat .k { display:block; font-family:var(--pf); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .hud .stat b { font-family:var(--tf); font-size:15px; line-height:1.5; }
  #heartsWrap { position:absolute; top:8px; right:10px; z-index:2; pointer-events:none; }
  #hearts { display:inline-flex; gap:4px; direction:ltr; }
  #tip { font-size:13px; color:var(--mute); height:70px; overflow:hidden; padding:2px 6px 6px; line-height:1.5; }
  #tip.warn { color:var(--red-hi); } #tip.good { color:var(--ok); }
  #stage { flex:1; min-height:0; position:relative; margin:3px 3px 6px; }
  canvas#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#0a0d13; box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
  #ctx { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; align-items:center; height:62px; padding:0 4px; direction:ltr; flex:none; }
  #ctx button { width:100%; min-width:0; margin:0; }
  #bar { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:6px 4px 14px; height:72px; flex:none; direction:ltr; }
  #bar button { width:100%; min-width:0; margin:0; padding:10px 6px; white-space:nowrap; position:relative; }
  .adtag { position:absolute; top:-6px; right:-4px; background:var(--gold); color:#1a1420; font-family:var(--pf); font-size:9px; padding:1px 4px; box-shadow:0 0 0 2px var(--edge); }
  /* panels and overlays */
  .overlay { position:fixed; inset:0; background:rgba(5,7,12,.88); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .overlay.on { display:flex; }
  #pauseOv, #setOv, #lvOv, #howOv, #introOv { align-items:flex-start; padding-top:max(14px, 5vh); }
  .card { background:var(--panel); padding:20px 18px; max-width:460px; width:100%; text-align:center; max-height:92%; overflow:auto; }
  .card h2 { margin:2px 0 14px; font-family:var(--tf); font-size:15px; line-height:1.6; letter-spacing:.04em; text-transform:uppercase; text-shadow:3px 3px 0 var(--edge); }
  .stars { display:flex; gap:10px; justify-content:center; margin:6px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:10px 3px 14px; direction:ltr; }
  .grid button { padding:6px 0; min-height:52px; flex-direction:column; gap:3px; margin:0; font-size:13px; }
  .grid button .row2 { display:flex; gap:2px; min-height:12px; align-items:center; }
  .chap { font-family:var(--pf); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin-top:16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px 10px; text-align:start; }
  .chap b { color:var(--ink); font-size:12px; white-space:nowrap; }
  .chap span { display:inline-flex; align-items:center; gap:6px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .col { display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .muted { color:var(--mute); font-size:13px; margin-top:8px; line-height:1.6; }
  #adCount { font-family:var(--tf); font-size:26px; margin:14px 0; }
  .set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:3px solid var(--edge); text-align:start; }
  .set label { font-family:var(--pf); font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; } .set small { display:block; color:var(--mute); font-size:11px; margin-top:3px; font-family:system-ui,sans-serif; text-transform:none; letter-spacing:0; font-weight:400; }
  .seg { display:flex; gap:8px; } .seg button { min-height:38px; padding:6px 12px; }
  .seg button.sel { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  .tog { min-width:68px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:130px; height:14px; background:var(--lo); box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); border-radius:0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:24px; background:var(--red); border:0; border-radius:0; box-shadow:0 0 0 3px var(--edge), inset 0 3px 0 0 var(--red-hi), inset 0 -3px 0 0 var(--red-lo); }
  input[type=range]::-moz-range-thumb { width:14px; height:24px; background:var(--red); border:0; border-radius:0; box-shadow:0 0 0 3px var(--edge), inset 0 3px 0 0 var(--red-hi), inset 0 -3px 0 0 var(--red-lo); }
  #introCv { display:block; width:min(100%, 360px); aspect-ratio:120/72; margin:2px auto 14px; image-rendering:pixelated; background:#0a0d13; box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
  .howl { text-align:start; line-height:1.7; font-size:14px; padding-inline-start:20px; margin:8px 0; }
  .howl li { margin-bottom:8px; }
  /* main menu */
  #menu { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px 24px calc(34px + env(safe-area-inset-bottom)); overflow:hidden; background:#0d1017; }
  #menu.on { display:flex; }
  #menuBg { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; z-index:0; }
  #menu::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 38%, rgba(13,16,23,0) 0%, rgba(13,16,23,.4) 60%, rgba(6,8,13,.72) 100%); }
  #menu > :not(#menuBg) { position:relative; z-index:2; }
  #menu::after { z-index:1; }
  #logo { width:min(80vw, 330px); aspect-ratio:128/84; image-rendering:pixelated; }
  #menu h1 { margin:0; font-family:var(--tf); font-weight:400; font-size:min(8.6vw, 34px); line-height:1.25; letter-spacing:.02em; text-transform:uppercase; text-align:center; text-shadow:4px 4px 0 var(--edge); }
  #menu h1 em { font-style:normal; color:var(--red); }
  #menu .tag { color:#a9b2c6; font-size:14px; text-align:center; max-width:310px; line-height:1.6; text-shadow:0 2px 0 #06080d; }
  #menu .col { width:100%; max-width:320px; margin-top:10px; }
  #menu .foot { position:absolute; z-index:2; bottom:calc(12px + env(safe-area-inset-bottom)); font-family:var(--pf); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#566079; }
</style>
</head>

</div>

<div class="overlay" id="pauseOv"><div class="card">

</div></div>

<div class="overlay" id="winOv"><div class="card">

  <div class="set"><div><label id="sMusL"></label></div><button class="tog" id="sMus"></button></div>
  <div class="set"><div><label id="sMusVolL"></label></div><input type="range" id="sMusVol" min="0" max="100" step="5"></div>

<script>
'use strict';
const P = window.Prison, LEVELS = window.PRISON_LEVELS;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ------------------------------------------------------------ settings */
const DEFAULTS = { lang: 'en', sfx: true, vol: 70, music: true, musicVol: 60, vibrate: true, hearts: false, reduceMotion: false, unlockAll: false };
const settings = Object.assign({}, DEFAULTS, store.get('pb_settings', {}));
const saveSettings = () => store.set('pb_settings', settings);

/* ----------------------------------------------------------- progression */
const HEARTS_MAX = 3, FREE_HINTS = 1, STARS_FRACTION = 0.4;
const CHAPTERS = [
  { en: 'Cells', fa: 'سلول‌ها', size: 15 },
  { en: 'Yard I', fa: 'حیاط ۱', size: 10 }, { en: 'Yard II', fa: 'حیاط ۲', size: 10 }, { en: 'Yard III', fa: 'حیاط ۳', size: 10 },
  { en: 'Gates I', fa: 'دروازه‌ها ۱', size: 10 }, { en: 'Gates II', fa: 'دروازه‌ها ۲', size: 10 },
  { en: 'Mirrors I', fa: 'آینه‌ها ۱', size: 10 }, { en: 'Mirrors II', fa: 'آینه‌ها ۲', size: 10 },
  { en: 'Control I', fa: 'کنترل ۱', size: 10 }, { en: 'Control II', fa: 'کنترل ۲', size: 10 },
  { en: 'Kennel I', fa: 'لانهٔ سگ ۱', size: 10 }, { en: 'Kennel II', fa: 'لانهٔ سگ ۲', size: 10 },
  { en: 'Night Shift I', fa: 'شیفت شب ۱', size: 10 }, { en: 'Night Shift II', fa: 'شیفت شب ۲', size: 10 },
];
const chapStart = CHAPTERS.map((_, i) => CHAPTERS.slice(0, i).reduce((n, c) => n + c.size, 0));
const chapterOf = i => { let ci = 0; while (ci + 1 < CHAPTERS.length && i >= chapStart[ci + 1]) ci++; return ci; };    // level index -> chapter index
const chapNeed = ci => Math.round(chapStart[ci] * 3 * STARS_FRACTION);                                                 // stars from earlier chapters needed to enter
let best = store.get('pb_best3', {});
function starsBefore(ci) { let s = 0; for (let i = 0; i < chapStart[ci] && i < LEVELS.length; i++) s += (best[LEVELS[i].id] && best[LEVELS[i].id].stars) || 0; return s; }
const chapterLocked = ci => !settings.unlockAll && ci > 0 && starsBefore(ci) < chapNeed(ci);
const levelLocked = i => chapterLocked(chapterOf(i));
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!levelLocked(i) && !best[LEVELS[i].id]) return i; return Math.max(0, LEVELS.length - 1); }

/* ---------------------------------------------------------------- text */
const T = {
  en: {
    tag: 'Move the darkness. Slip the prisoner past cameras and guards.', foot: 'Playtest build',
    play: 'Play', cont: lv => 'Continue · Level ' + lv, levels: 'Levels', how: 'How to play', settings: 'Settings', close: 'Close', back: 'Back',
    dogTip: 'Dog selected: tap a tile of its rail to send it there, tap the prisoner to let go.', doorBlocked: 'The dog is standing in the doorway.',
    guardTip: 'Guard selected: tap it again to turn, tap a rail tile to send it, tap the prisoner to let go.', gotIt: 'Got it', itemsL: 'Items', itemNames: { cam: 'Camera', guard: 'Guard', door: 'Door', mirror: 'Mirror', dog: 'Dog', light: 'Searchlight' },
    intro: {
      cam: { title: 'New: Camera', list: ['A camera throws red light along a line. The prisoner can never stand in it.', 'Tap a camera to turn it a quarter turn clockwise.', 'Walking is free. Only your taps on cameras count.'] },
      guard: { title: 'New: Guard', list: ['A guard walks back and forth on its rail and sees 3 tiles ahead. Behind it is a blind spot.', 'Tap it to select it, tap again to turn it round, or tap a tile of its rail to send it there.', 'Every step is one action.'] },
      door: { title: 'New: Door', list: ['Tap a door to open or close it.', 'A closed door blocks light and movement.', 'Close one to cut a beam, open one to let it through.'] },
      mirror: { title: 'New: Mirror', list: ['A mirror bends light by 90 degrees.', 'Tap it to flip between the two slants.', 'Now a camera can reach tiles around a corner.'] },
      dog: { title: 'New: Guard dog', list: ['A dog smells every tile it can walk to. The prisoner can never stand on a smelly tile.', 'Tap the dog, then a tile of its rail to send it there. Every step is one action.', 'A closed door stops the smell. Shut the dog into another room!', 'A door cannot be closed while the dog stands in it.'] },
      light: { title: 'New: Searchlight', list: ['A searchlight throws red light like a camera, but you cannot turn it. After EVERY action you take, it swings a quarter turn clockwise by itself.', 'Tap the searchlight to wait: an action that changes nothing else, so only the lights swing.', 'The dashed outline shows where the light will point after your next action.', 'An action is refused if the swing would light the prisoner.'] },
      all: { title: 'Everything together', list: ['Cameras, guards, doors and mirrors work as you know them.', 'Some levels need several rounds: move the prisoner on, then change the room again.'] },
    },
    pause: 'Paused', resume: 'Resume', restart: 'Restart level', mainMenu: 'Main menu',
    level: 'Level', moves: 'Actions', best: 'Best', undo: 'Undo', hint: 'Hint', hintAd: 'Hint · Ad', toExit: 'Escape', turn: 'Turn', flip: 'Switch',
    pick: 'Tap a dark tile to walk. Tap a camera to turn it clockwise.',
    refused: 'Not allowed: that would expose the prisoner. Move him somewhere dark first.', unreach: 'The prisoner cannot get there from here.',
    pathClear: 'The way is clear. Send the prisoner to the exit.', hintWho: 'Try: ', hintCam: 'turn this camera', hintGuard: 'move this guard', hintDoor: 'use this door', hintMirror: 'flip this mirror', hintDog: 'move this dog', hintLight: 'wait: tap the searchlight', wait: 'Wait',
    escaped: 'Escaped!', winText: (m, p, l) => `${m} actions · best ${p}` + (l ? ` · ${l} heart(s) lost` : ''), retry: 'Retry', next: 'Next level', done: 'All levels cleared!',
    seen: 'Spotted! You lost a heart.', caught: 'Caught!', caughtText: 'You ran out of hearts.', revive: 'Ad: continue with 1 heart',
    locked: (n, h) => `Locked: needs ${n} stars (you have ${h})`, gate: (n, h) => `The next block needs ${n} stars. You have ${h}.`,
    adTitle: 'Placeholder ad', adText: 'In the real game a rewarded video plays here. This is only a stand-in; no real ad is shown.', adWait: s => `${s}s…`, adReady: 'Ready', adClaim: 'Claim reward', adCancel: 'Cancel',
    sLang: 'Language', sSfx: 'Sound effects', sVol: 'Effects volume', sMus: 'Music', sMusVol: 'Music volume', sVib: 'Vibration', sHearts: 'Hearts mode', sHeartsS: 'You may cross light, but each time you are spotted you lose a heart.',
    sMotion: 'Reduce motion', sMotionS: 'Less shaking and pulsing.', sUnlock: 'Unlock all levels', sUnlockS: 'For testing.', sReset: 'Reset progress', sResetSure: 'Tap again to erase', sResetDone: 'Progress erased',
    on: 'On', off: 'Off', setTitle: 'Settings', howTitle: 'How to play',
    howList: [
      'Tap a dark tile to walk the prisoner there. Walking is free.',
      'Only your actions count: tap a camera to turn it clockwise (three taps turn it left). Tap a guard to select it, tap it again to turn it round, or tap a tile of its rail to send it there (each step is one action). Tap a door or a mirror to switch it. Tap a dog, then a tile of its rail, to send it there. Searchlights swing a quarter turn after every action; tap one to wait.',

    for (let i = 0; i < 4; i++) { const ph = calm ? 0 : (now / 2600 + hash(x, y, i + 30)) % 1, dx = hash(x, y, i + 40) * (cs - 3), dy = (1 - ph) * (cellH - 3); ctx.fillStyle = `rgba(215,255,140,${calm ? .5 : .6 * Math.sin(ph * Math.PI)})`; ctx.fillRect(FX(x) + dx, FY(y) + dy, 2, 2); }
  }
  e.rays.forEach(r => { if (!(r.first && (r.who < nCam() || r.who >= lightBase()))) floorBeam(r, pulse); });
  L.guards.forEach(g => {
    ctx.strokeStyle = 'rgba(160,190,255,.28)'; ctx.lineWidth = Math.max(2, cs * .07); ctx.lineCap = 'round'; ctx.setLineDash([cs * .08, cs * .14]);
    ctx.beginPath(); g.rail.forEach((c, i) => { const px = FX(c % L.w + .5), py = FY(((c / L.w) | 0) + .5); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); ctx.setLineDash([]);
  });
  L.dogs.forEach(d => {
    ctx.strokeStyle = 'rgba(255,190,110,.32)'; ctx.lineWidth = Math.max(2, cs * .07); ctx.lineCap = 'round'; ctx.setLineDash([cs * .05, cs * .13]);
    ctx.beginPath(); d.rail.forEach((c, i) => { const px = FX(c % L.w + .5), py = FY(((c / L.w) | 0) + .5); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); ctx.setLineDash([]);
  });
  { const x = L.E % L.w, y = (L.E / L.w) | 0, px = FX(x), py = FY(y);                         // exit
    ctx.fillStyle = `rgba(65,211,146,${.22 + .12 * pulse})`; ctx.fillRect(px, py, cs, cellH);
    ctx.fillStyle = '#0f3d2a'; ctx.fillRect(px + cs * .14, py + cellH * .06, cs * .72, cellH * .56);
    ctx.fillStyle = '#41d392'; for (let i = 0; i < 5; i++) ctx.fillRect(px + cs * .2 + i * cs * .13, py + cellH * .1, cs * .06, cellH * .48);
    ctx.fillStyle = '#d9fff0'; ctx.font = `800 ${cs * .17}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EXIT', px + cs / 2, py + cellH * .33); }
  if (flash > 0 && flashCell >= 0) { ctx.fillStyle = `rgba(255,255,255,${.5 * flash})`; ctx.fillRect(FX(flashCell % L.w), FY((flashCell / L.w) | 0), cs, cellH); }
  L.guards.forEach((g, j) => {
    const c = g.rail[dg[nCam() + j] >> 1], tx = c % L.w, ty = (c / L.w) | 0, q = gdraw[j] || (gdraw[j] = { x: tx, y: ty });
    const k = calm ? 1 : .3; q.x += (tx - q.x) * k; q.y += (ty - q.y) * k; if (Math.abs(tx - q.x) < .01) q.x = tx; if (Math.abs(ty - q.y) < .01) q.y = ty;
  });
  L.dogs.forEach((o, j) => {
    const c = o.rail[dg[dogBase() + j]], tx = c % L.w, ty = (c / L.w) | 0, q = ddraw[j] || (ddraw[j] = { x: tx, y: ty, f: 0, moving: 0 });
    const k = calm ? 1 : .26, ox0 = q.x, oy0 = q.y; q.x += (tx - q.x) * k; q.y += (ty - q.y) * k; if (Math.abs(tx - q.x) < .01) q.x = tx; if (Math.abs(ty - q.y) < .01) q.y = ty;
    if (q.x - ox0 > .001) q.f = 0; else if (q.x - ox0 < -.001) q.f = 1;
    q.moving = (q.x !== tx || q.y !== ty) ? 1 : 0;
  });
  let tfx = thief % L.w, tfy = (thief / L.w) | 0, frameIdx = 0;
  if (walking && walking.path.length) { const nx = walking.path[0], k = Math.min(1, walking.t / 110); tfx += (nx % L.w - tfx) * k; tfy += (((nx / L.w) | 0) - tfy) * k; frameIdx = 1 + (Math.floor(now / 110) % 2); }
  const sc = cs * .047, thiefRow = Math.round(tfy);
  const drawGuard = (j, ghost) => {
    const g = L.guards[j], q = gdraw[j], cx = FX(q.x + .5), fy = FY(q.y) + cellH * .86, d = P.guardFacingDir(g, dg[nCam() + j] & 1);
    if (ghost) { ctx.save(); ctx.globalAlpha = .4; drawSprite(person('guard', d === 3 ? 1 : d, 0), cx, fy, sc, d === 3); ctx.restore(); return; }
    shadow(cx, fy, cs * .26); drawSprite(person('guard', d === 3 ? 1 : d, 0), cx, fy, sc, d === 3, glowFor(nCam() + j, pulse));
  };
  const drawThief = ghost => {
    const cx = FX(tfx + .5), fy = FY(tfy) + cellH * .86, bob = frameIdx ? Math.abs(Math.sin(now / 110 * Math.PI)) * cs * .06 : 0, spr = person('thief', thiefDir === 3 ? 1 : thiefDir, frameIdx);
    if (ghost) { ctx.save(); ctx.globalAlpha = .4; drawSprite(spr, cx, fy - bob, sc, thiefDir === 3); ctx.restore(); return; }
    shadow(cx, fy, cs * .26); drawSprite(spr, cx, fy - bob, sc, thiefDir === 3);
    if (heartsOn() && e.lit[thief]) { ctx.fillStyle = '#ff3b52'; ctx.font = `900 ${cs * .38}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText('!', cx, fy - cs * 1.18 - bob); }
  };
  const drawDog = j => {
    const q = ddraw[j], cx = FX(q.x + .5), fy = FY(q.y) + cellH * .86, frm = q.moving ? 1 + (Math.floor(now / 90) % 2) : 0;
    shadow(cx, fy, cs * .3); drawSprite(dogSprite(frm), cx, fy, sc * 1.05, q.f === 1, glowFor(dogBase() + j, pulse));
  };
  const dogsAt = y => L.dogs.forEach((o, j) => { if (Math.round(ddraw[j].y) === y) drawDog(j); });
  const guardsAt = y => L.guards.forEach((g, j) => { if (Math.round(gdraw[j].y) === y) drawGuard(j, false); });
  const thiefAt = y => { if (thiefRow === y) drawThief(false); };
  const togAt = new Map(); L.toggles.forEach((t, j) => togAt.set(t.c, nCam() + nGuard() + j));
  for (let y = 0; y < L.h; y++) {
    for (let x = 0; x < L.w; x++) {
      const c = y * L.w + x;
      if (L.wall[c]) {
        drawWall(x, y);
        const k = L.cams.findIndex(q => q.c === c);
        if (k >= 0) { const d = dg[k], cx = FX(x + .5), cy = FY(y) - wallH + cellH * .72;
          drawSprite(camSprite(d === 3 ? 1 : d), cx, cy, cs * .05, d === 3, glowFor(k, pulse));
          const lens = d === 1 ? 4.5 : d === 3 ? -4.5 : 0;
          cameraBeam(camOf.get(k), cx + lens * cs * .05, cy - cs * .3, pulse); }
        const li = L.lights.findIndex(q => q.c === c);
        if (li >= 0) { const k = lightBase() + li, d = dg[k], cx = FX(x + .5), cy = FY(y) - wallH + cellH * .72;
          drawSprite(lampSprite(d === 3 ? 1 : d), cx, cy, cs * .05, d === 3, glowFor(k, pulse));
          const lens = d === 1 ? 4.5 : d === 3 ? -4.5 : 0, ly = cy - cs * .3;
          cameraBeam(camOf.get(k), cx + lens * cs * .05, ly, pulse);
          const nr = nextRays.get(k); if (nr) ghostBeam(nr, cx + (nr.d === 1 ? 4.5 : nr.d === 3 ? -4.5 : 0) * cs * .05, ly); }
      } else if (togAt.has(c)) {
        const k = togAt.get(c), t = L.toggles[k - nCam() - nGuard()];
        if (t.kind === 'mirror') { drawMirror(x, y, dg[k], k, pulse); blockGlow(x, y, k, pulse); }
        else if (dg[k] === 1) { drawDoorClosed(x, y); blockGlow(x, y, k, pulse); }
        else drawDoorOpen(x, y, k, pulse);
      }
    }
    guardsAt(y); dogsAt(y); thiefAt(y);
  }
  ctx.restore();
}
setFavicon(); applyLang(); syncSettingsUI();
load(store.get('pb_last', 0)); toMenu(); requestAnimationFrame(frame);
</script>
