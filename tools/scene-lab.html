const wallH = (cx, cy) => { if (!st.helpers) return HF; const [rx, ry] = rotXY(cx + .5, cy + .5); return (rx > gw - 1 || ry > gh - 1) ? HL : HF; };
function layout() {

  const M = 4, minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);

  cv.width = LW; cv.height = LH; ctx.imageSmoothingEnabled = false;

}
function cellCorners(cx, cy, z = 0) { return [proj(cx, cy, z), proj(cx + 1, cy, z), proj(cx + 1, cy + 1, z), proj(cx, cy + 1, z)]; }

/* ------------------------------------------------------------------------------------------------------------------ pixel sprites from small shapes (flat tones, no outline, light from the left) */
const COL = { // palette letters
  d: '#ce7143', g: '#bd5447', D: '#e89a60',                     // hair: light, shadow, glint
  c: '#d29978', f: '#a56561', b: '#e8c583',                     // skin: mid, shadow, light
  v: '#f1e9d0', w: '#e0d6b8', W: '#a89e84',                     // cream stripe: light, mid, shadow
  a: '#4a4f5e', k: '#2b2f39', K: '#171a21',                     // dark stripe / dark cloth: light, mid, shadow
  e: '#101216',                                                 // eyes, soles
  n: '#4c6397', N: '#2f3f68', m: '#1a2138', M: '#2a3556',       // guard uniform: light, mid, cap, cap light
  y: '#d8b050', Y: '#8a6a28', s: '#c58a6a', S: '#8f5a4c',       // brass, brass shadow, guard skin: mid, shadow
  o: '#b2603f', O: '#7e402e', P: '#4e2a22', u: '#a8825a', U: '#7a5a3c', V: '#4e3a28', t: '#4f917c', T: '#2f5f52', X: '#1d3a34', l: '#e9d8a0', j: '#ffe9a8',
  r: '#e04a3c', R: '#8c241e', z: '#aeb6c0', Z: '#6c7480', Q: '#3c424c', q: '#20242a', // red lens, metal tones
};
class G { constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill('.'); }
  px(x, y, ch) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = ch; return this; }
  rect(x, y, w, h, ch) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, ch); return this; }
  /* fill a shape (fn(x,y) -> bool) with three tones: the left pixels light, the right pixels shadowed, the rest mid */
  shape(fn, lit, mid, sh, x0 = 0, y0 = 0, x1 = this.w, y1 = this.h) {
    for (let y = y0; y < y1; y++) { let a = -1, b = -1; for (let x = x0; x < x1; x++) if (fn(x, y)) { if (a < 0) a = x; b = x; }
      if (a < 0) continue; const wd = b - a + 1;
      for (let x = a; x <= b; x++) this.px(x, y, wd >= 3 && x === a ? lit : wd >= 4 && x === a + 1 && wd >= 6 ? lit : wd >= 3 && x === b ? sh : wd >= 6 && x === b - 1 ? sh : mid); }
    return this; }
  mirror() { const o = new G(this.w, this.h); for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) o.d[y * this.w + x] = this.d[y * this.w + (this.w - 1 - x)]; return o; }
  canvas() { const [c, x] = mk(this.w, this.h), id = x.createImageData(this.w, this.h); for (let i = 0; i < this.d.length; i++) { const ch = this.d[i]; if (ch === '.') continue; const [r, g, b] = hex(COL[ch]); id.data[i * 4] = r; id.data[i * 4 + 1] = g; id.data[i * 4 + 2] = b; id.data[i * 4 + 3] = 255; } x.putImageData(id, 0, 0); return c; }
}
const ell = (cx, cy, rx, ry) => (x, y) => ((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1;
const box = (x0, y0, x1, y1) => (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
const sprites = new Map();
/* a person: 16x38, feet on the bottom row. back = seen from behind (3/4 view); step 0..3 = the walk cycle (0 and 2: feet apart), -1 = standing. Faces right; the left view is a mirror. */
function person(kind, back, step) {
  const key = kind + back + step; if (sprites.has(key)) return sprites.get(key);

  const lf = step === 0 ? 0 : step === 2 ? 2 : passing ? 1 : 0, rf = step === 2 ? 0 : step === 0 ? 2 : passing ? 1 : 0;   // how far each leg is lifted
  const armL = step === 0 ? -1 : step === 2 ? 1 : 0, armR = -armL;                           // arms swing against the legs

/* a security camera on a short arm (seen from the front or from behind; faces right) */
function camera(back) {

  g.shape(box(1, 3, 12, 10), 'z', 'Z', 'Q', 0, 3, 16, 11); g.rect(1, 9, 12, 1, 'Q'); g.rect(2, 2, 10, 1, 'z');
  if (!back) { g.rect(9, 4, 4, 5, 'q'); g.px(10, 5, 'r'); g.px(11, 6, 'r'); g.px(10, 6, 'R'); g.px(13, 5, 'q'); } else { g.rect(2, 5, 8, 1, 'Q'); g.px(4, 7, 'q'); g.px(6, 7, 'q'); g.px(8, 7, 'q'); }

/* props around the building: an oil drum, a crate, a bin, a dumpster and a lamp post (drawn from small shapes, same flat three-tone shading) */
function prop(kind) {
  const key = 'prop' + kind; if (sprites.has(key)) return sprites.get(key);
  let g;
  if (kind === 'barrel') { g = new G(16, 24); g.shape(box(2, 6, 13, 21), 'o', 'O', 'P', 0, 6, 16, 22); g.shape(ell(8, 6.4, 6, 2.8), 'l', 'o', 'O', 0, 3, 16, 10); g.rect(2, 10, 12, 1, 'P'); g.rect(2, 16, 12, 1, 'P'); g.px(6, 5, 'P'); g.px(9, 6, 'P'); g.shape(ell(8, 21.2, 6, 2.2), 'P', 'P', 'P', 0, 19, 16, 24); }

/* ------------------------------------------------------------------------------------------------------------------ level, plan, animation */
