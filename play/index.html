<!doctype html>
<html lang="en" dir="ltr">
<head>

<style>
  /* pixel UI: Silkscreen for labels, Press Start 2P for the title and numbers, paragraphs stay in the system font for reading.
     Fonts are SIL OFL; tools/build-single.js inlines them. Boxes are drawn with stepped box-shadows, so corners are cut, not rounded. */
  @font-face { font-family:'Silkscreen'; font-weight:400; font-display:swap; src:url(fonts/silkscreen-400.ttf) format('truetype'); }
  @font-face { font-family:'Silkscreen'; font-weight:700; font-display:swap; src:url(fonts/silkscreen-700.ttf) format('truetype'); }
  @font-face { font-family:'Press Start 2P'; font-weight:400; font-display:swap; src:url(fonts/press-start-2p.woff2) format('woff2'); }
  :root { color-scheme:dark; --pf:'Silkscreen','Courier New',monospace; --tf:'Press Start 2P','Silkscreen','Courier New',monospace;
    --bg:#0d1017; --panel:#1b2130; --panel2:#262e42; --edge:#06080d; --hi:#3d4863; --lo:#0f131c; --ink:#e8ecf4; --mute:#8b94a8;
    --red:#ff3b52; --red-hi:#ff8795; --red-lo:#a81c30; --gold:#ffc54a; --ok:#41d392; --line:#2a3246; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #app { height:100%; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
  /* the pixel box: 3px edge without corners, light top, dark bottom */
  button, .card, .hud, .pix { --h:var(--hi); --l:var(--lo); --e:var(--edge);
    box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--h), inset 0 -3px 0 0 var(--l); border-radius:0; }
  button { font-family:var(--pf); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--panel2); border:0; padding:10px 14px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; margin:3px; }
  button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--l), inset 0 -3px 0 0 var(--h); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  button.on { color:var(--red-hi); --e:var(--red-lo); }
  button.big { width:100%; min-height:54px; font-size:14px; margin:0; }
  .ic { display:inline-block; flex:none; background:currentColor; -webkit-mask:var(--m) center/100% 100% no-repeat; mask:var(--m) center/100% 100% no-repeat; image-rendering:pixelated; }
  .ic.rot90 { transform:rotate(90deg); } .ic.flipx { transform:scaleX(-1); } .ic.gold { color:var(--gold); } .ic.dim { color:#394156; } .ic.red { color:var(--red); }
  /* HUD */
  .hud { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:10px 4px 10px; padding:9px 10px; background:var(--panel); }
  .hud button.sq { min-height:40px; width:40px; padding:0; margin:0; }
  .hud .lv { flex:1; min-width:0; }
  .hud .lv b { display:block; font-family:var(--pf); font-size:14px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .lv span { display:block; font-family:var(--pf); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .stat { text-align:center; min-width:46px; }
  .hud .stat .k { display:block; font-family:var(--pf); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .hud .stat b { font-family:var(--tf); font-size:15px; line-height:1.5; }
  #heartsWrap { flex-basis:100%; display:flex; justify-content:flex-end; padding-top:2px; }
  #hearts { display:inline-flex; gap:4px; direction:ltr; }
  #tip { font-size:13px; color:var(--mute); min-height:38px; padding:2px 6px 6px; line-height:1.5; }
  #tip.warn { color:var(--red-hi); } #tip.good { color:var(--ok); }
  #stage { flex:1; min-height:0; position:relative; margin:3px 3px 6px; }
  canvas#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#0a0d13; box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
  #bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:8px 0 14px; direction:ltr; }
  #bar .sep { width:3px; background:var(--edge); margin:4px 4px; }
  #bar button { min-width:50px; }
  /* panels and overlays */
  .overlay { position:fixed; inset:0; background:rgba(5,7,12,.88); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .overlay.on { display:flex; }
  .card { background:var(--panel); padding:20px 18px; max-width:460px; width:100%; text-align:center; max-height:92%; overflow:auto; }
  .card h2 { margin:2px 0 14px; font-family:var(--tf); font-size:15px; line-height:1.6; letter-spacing:.04em; text-transform:uppercase; text-shadow:3px 3px 0 var(--edge); }
  .stars { display:flex; gap:10px; justify-content:center; margin:6px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:10px 3px 14px; direction:ltr; }
  .grid button { padding:6px 0; min-height:52px; flex-direction:column; gap:3px; margin:0; font-size:13px; }
  .grid button .row2 { display:flex; gap:2px; min-height:12px; align-items:center; }
  .chap { font-family:var(--pf); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin-top:16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px 10px; text-align:start; }
  .chap b { color:var(--ink); font-size:12px; white-space:nowrap; }
  .chap span { display:inline-flex; align-items:center; gap:6px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .col { display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .muted { color:var(--mute); font-size:13px; margin-top:8px; line-height:1.6; }
  #adCount { font-family:var(--tf); font-size:26px; margin:14px 0; }
  .set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:3px solid var(--edge); text-align:start; }
  .set label { font-family:var(--pf); font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; } .set small { display:block; color:var(--mute); font-size:11px; margin-top:3px; font-family:system-ui,sans-serif; text-transform:none; letter-spacing:0; font-weight:400; }
  .seg { display:flex; gap:8px; } .seg button { min-height:38px; padding:6px 12px; }
  .seg button.sel { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  .tog { min-width:68px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:130px; height:14px; background:var(--lo); box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); border-radius:0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:24px; background:var(--red); border:0; border-radius:0; box-shadow:0 0 0 3px var(--edge), inset 0 3px 0 0 var(--red-hi), inset 0 -3px 0 0 var(--red-lo); }
  input[type=range]::-moz-range-thumb { width:14px; height:24px; background:var(--red); border:0; border-radius:0; box-shadow:0 0 0 3px var(--edge), inset 0 3px 0 0 var(--red-hi), inset 0 -3px 0 0 var(--red-lo); }
  .howl { text-align:start; line-height:1.7; font-size:14px; padding-inline-start:20px; margin:8px 0; }
  .howl li { margin-bottom:8px; }
  /* main menu */
  #menu { position:fixed; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px 24px calc(34px + env(safe-area-inset-bottom)); overflow:hidden; background:#0d1017; }
  #menu.on { display:flex; }
  #menuBg { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; z-index:0; }
  #menu::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 38%, rgba(13,16,23,0) 0%, rgba(13,16,23,.4) 60%, rgba(6,8,13,.72) 100%); }
  #menu > :not(#menuBg) { position:relative; z-index:2; }
  #menu::after { z-index:1; }
  #logo { width:min(80vw, 330px); aspect-ratio:128/84; image-rendering:pixelated; }
  #menu h1 { margin:0; font-family:var(--tf); font-weight:400; font-size:min(8.6vw, 34px); line-height:1.25; letter-spacing:.02em; text-transform:uppercase; text-align:center; text-shadow:4px 4px 0 var(--edge); }
  #menu h1 em { font-style:normal; color:var(--red); }
  #menu .tag { color:#a9b2c6; font-size:14px; text-align:center; max-width:310px; line-height:1.6; text-shadow:0 2px 0 #06080d; }
  #menu .col { width:100%; max-width:320px; margin-top:10px; }
  #menu .foot { position:absolute; z-index:2; bottom:calc(12px + env(safe-area-inset-bottom)); font-family:var(--pf); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#566079; }
</style>
</head>

  <div class="set"><div><label id="sUnlockL"></label><small id="sUnlockS"></small></div><button class="tog" id="sUnlock"></button></div>
  <div class="set"><div><label id="sResetL"></label></div><button id="sReset"></button></div>
  <div class="row"><button class="primary" id="setClose"></button></div>
</div></div>

<div class="overlay" id="adOv"><div class="card">

</div></div>

<script>
'use strict';
const P = window.Prison, LEVELS = window.PRISON_LEVELS;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ------------------------------------------------------------ settings */
const DEFAULTS = { lang: 'en', sfx: true, vol: 70, vibrate: true, hearts: false, reduceMotion: false, unlockAll: false };
const settings = Object.assign({}, DEFAULTS, store.get('pb_settings', {}));
const saveSettings = () => store.set('pb_settings', settings);

/* ----------------------------------------------------------- progression */
const HEARTS_MAX = 3, FREE_HINTS = 1, STARS_PER_BLOCK = 12;
const CHAPTERS = [
  { en: 'Cells I', fa: 'سلول‌ها ۱' }, { en: 'Cells II', fa: 'سلول‌ها ۲' }, { en: 'Cells III', fa: 'سلول‌ها ۳' },
  { en: 'Yard I', fa: 'حیاط ۱' }, { en: 'Yard II', fa: 'حیاط ۲' }, { en: 'Yard III', fa: 'حیاط ۳' },
  { en: 'Gates I', fa: 'دروازه‌ها ۱' }, { en: 'Gates II', fa: 'دروازه‌ها ۲' },
  { en: 'Mirrors I', fa: 'آینه‌ها ۱' }, { en: 'Mirrors II', fa: 'آینه‌ها ۲' },
  { en: 'Control I', fa: 'کنترل ۱' }, { en: 'Control II', fa: 'کنترل ۲' },
];
const chapterOf = i => Math.floor(i / 10);                       // level index -> chapter index
const chapNeed = ci => ci * STARS_PER_BLOCK;                     // stars (from earlier chapters) needed to enter
let best = store.get('pb_best3', {});
function starsBefore(ci) { let s = 0; for (let i = 0; i < ci * 10; i++) s += (best[LEVELS[i] && LEVELS[i].id] && best[LEVELS[i].id].stars) || 0; return s; }
const chapterLocked = ci => !settings.unlockAll && ci > 0 && starsBefore(ci) < chapNeed(ci);
const levelLocked = i => chapterLocked(chapterOf(i));
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!levelLocked(i) && !best[LEVELS[i].id]) return i; return Math.max(0, LEVELS.length - 1); }

/* ---------------------------------------------------------------- text */

    seen: 'Spotted! You lost a heart.', caught: 'Caught!', caughtText: 'You ran out of hearts.', revive: 'Ad: continue with 1 heart',
    locked: (n, h) => `Locked: needs ${n} stars (you have ${h})`, gate: (n, h) => `The next block needs ${n} stars. You have ${h}.`,
    adTitle: 'Placeholder ad', adText: 'In the real game a rewarded video plays here. This is only a stand-in; no real ad is shown.', adWait: s => `${s}s…`, adReady: 'Ready', adClaim: 'Claim reward', adCancel: 'Cancel',
    sLang: 'Language', sSfx: 'Sound effects', sVol: 'Volume', sVib: 'Vibration', sHearts: 'Hearts mode', sHeartsS: 'You may cross light, but each time you are spotted you lose a heart.',
    sMotion: 'Reduce motion', sMotionS: 'Less shaking and pulsing.', sUnlock: 'Unlock all levels', sUnlockS: 'For testing.', sReset: 'Reset progress', sResetSure: 'Tap again to erase', sResetDone: 'Progress erased',
    on: 'On', off: 'Off', setTitle: 'Settings', howTitle: 'How to play',
    howList: [
      'Tap a dark tile to walk the prisoner there. Walking is free.',
      'Only your actions count: tap a camera to turn it clockwise (three taps turn it left). Tap a guard, then use the arrows to walk it along its rail or the turn button to face the other way. Tap a door or a mirror to switch it.',
      'The prisoner must never stand in red light. An action that would light him is refused, so move him to a dark tile first.',
      'Walls, guards and closed doors stop sight. Mirrors bend a sight line by 90 degrees.',

    tips: {
      1: 'Cameras throw red light and the prisoner must stay out of it. Tap the camera to turn it, then tap the green exit.',
      2: 'A camera only turns clockwise, so turning it left takes three taps. Walking costs nothing; only actions are counted.',

      31: 'New: a guard walks along its rail. Tap it, then use the arrows to move or the turn button to face the other way. It sees only 3 tiles ahead and is blind behind.',

/* The logo is the in-game side camera drawn at 6x with a bigger lens: it blinks, its pupil follows the beam, the beam swings. */

function drawLogo(now) {

function draw(now) {
