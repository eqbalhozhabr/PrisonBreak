  :root { color-scheme:dark; --pf:'Silkscreen','Courier New',monospace; --tf:'Press Start 2P','Silkscreen','Courier New',monospace;
    --bg:#0d1017; --panel:#1b2130; --panel2:#262e42; --edge:#06080d; --hi:#3d4863; --lo:#0f131c; --ink:#e8ecf4; --mute:#8b94a8;
    --red:#ff3b52; --red-hi:#ff8795; --red-lo:#a81c30; --gold:#ffc54a; --ok:#41d392; --line:#2a3246; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #app { height:100%; height:100dvh; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
  /* the pixel box: 3px edge without corners, light top, dark bottom */
  button, .card, .hud, .pix { --h:var(--hi); --l:var(--lo); --e:var(--edge);
    box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--h), inset 0 -3px 0 0 var(--l); border-radius:0; }
  button { font-family:var(--pf); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--panel2); border:0; padding:10px 14px; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; margin:3px; }
  button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 -3px 0 0 var(--e), 0 3px 0 0 var(--e), -3px 0 0 0 var(--e), 3px 0 0 0 var(--e), inset 0 3px 0 0 var(--l), inset 0 -3px 0 0 var(--h); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  button.on { color:var(--red-hi); --e:var(--red-lo); }
  button.big { width:100%; min-height:54px; font-size:14px; margin:0; }
  .ic { display:inline-block; flex:none; background:currentColor; -webkit-mask:var(--m) center/100% 100% no-repeat; mask:var(--m) center/100% 100% no-repeat; image-rendering:pixelated; }
  .ic.rot90 { transform:rotate(90deg); } .ic.flipx { transform:scaleX(-1); } .ic.gold { color:var(--gold); } .ic.dim { color:#394156; } .ic.red { color:var(--red); }
  /* HUD */
  .hud { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:10px 4px 10px; padding:9px 10px; background:var(--panel); }
  .hud button.sq { min-height:40px; width:40px; padding:0; margin:0; }
  .hud .lv { flex:1; min-width:0; }
  .hud .lv b { display:block; font-family:var(--pf); font-size:14px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .lv span { display:block; font-family:var(--pf); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .stat { text-align:center; min-width:46px; }
  .hud .stat .k { display:block; font-family:var(--pf); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .hud .stat b { font-family:var(--tf); font-size:15px; line-height:1.5; }
  #heartsWrap { position:absolute; top:8px; right:10px; z-index:2; pointer-events:none; }
  #hearts { display:inline-flex; gap:4px; direction:ltr; }
  #tip { font-size:13px; color:var(--mute); height:70px; overflow:hidden; padding:2px 6px 6px; line-height:1.5; }
  #tip.warn { color:var(--red-hi); } #tip.good { color:var(--ok); }
  #stage { flex:1; min-height:0; position:relative; margin:3px 3px 6px; }
  canvas#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#0a0d13; box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }
  #ctx { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; align-items:center; height:62px; padding:0 4px; direction:ltr; flex:none; }
  #ctx button { width:100%; min-width:0; margin:0; }
  #bar { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:6px 4px 14px; height:72px; flex:none; direction:ltr; }
  #bar button { width:100%; min-width:0; margin:0; padding:10px 6px; white-space:nowrap; position:relative; }
  .adtag { position:absolute; top:-6px; right:-4px; background:var(--gold); color:#1a1420; font-family:var(--pf); font-size:9px; padding:1px 4px; box-shadow:0 0 0 2px var(--edge); }
  /* panels and overlays */
  .overlay { position:fixed; inset:0; background:rgba(5,7,12,.88); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .overlay.on { display:flex; }
  #pauseOv, #setOv, #lvOv, #howOv, #introOv { align-items:flex-start; padding-top:max(14px, 5vh); }
  .card { background:var(--panel); padding:20px 18px; max-width:460px; width:100%; text-align:center; max-height:92%; overflow:auto; }
  .card h2 { margin:2px 0 14px; font-family:var(--tf); font-size:15px; line-height:1.6; letter-spacing:.04em; text-transform:uppercase; text-shadow:3px 3px 0 var(--edge); }
  .stars { display:flex; gap:10px; justify-content:center; margin:6px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:10px 3px 14px; direction:ltr; }
  .grid button { padding:6px 0; min-height:52px; flex-direction:column; gap:3px; margin:0; font-size:13px; }
  .grid button .row2 { display:flex; gap:2px; min-height:12px; align-items:center; }
  .chap { font-family:var(--pf); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute); margin-top:16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:4px 10px; text-align:start; }
  .chap b { color:var(--ink); font-size:12px; white-space:nowrap; }
  .chap span { display:inline-flex; align-items:center; gap:6px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .col { display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .muted { color:var(--mute); font-size:13px; margin-top:8px; line-height:1.6; }
  #adCount { font-family:var(--tf); font-size:26px; margin:14px 0; }
  .set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:3px solid var(--edge); text-align:start; }
  .set label { font-family:var(--pf); font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; } .set small { display:block; color:var(--mute); font-size:11px; margin-top:3px; font-family:system-ui,sans-serif; text-transform:none; letter-spacing:0; font-weight:400; }
  .seg { display:flex; gap:8px; } .seg button { min-height:38px; padding:6px 12px; }
  .seg button.sel { background:var(--red); color:#fff; --h:var(--red-hi); --l:var(--red-lo); }
  .tog { min-width:68px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:130px; height:14px; background:var(--lo); box-shadow:0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); border-radius:0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:24px; background:var(--red); border:0; border-radius:0; box-shadow:0 0 0 3px var(--edge), inset 0 3px 0 0 var(--red-hi), inset 0 -3px 0 0 var(--red-lo); }

<script>
/* Blind Eye: rules, exact solver, and the level generator.
 *
 * Rules
 *  - Grid with walls. The thief starts on S and must reach E.
 *  - Cameras sit in wall cells and face N/E/S/W. One action turns a camera 90 degrees either way.
 *  - Guards stand on a straight rail of floor cells. One action steps a guard one cell along its rail (it turns
 *    to face the way it walks) or flips it around. A guard sees `range` cells ahead.
 *  - Doors (floor cells) open or close with one action. A closed door blocks movement and sight.
 *  - Mirrors (floor cells, pillars) flip between "/" and "\" with one action and bend any sight line
 *    that reaches them by 90 degrees.
 *  - Dogs (optional) stand on a rail like guards, but they do not look along a line: they smell the whole room they stand in,
 *    that is every tile they can reach without crossing a wall, a closed door, a mirror pillar or another watcher. Close a
 *    door behind a dog to trap its scent in the room it is in. One action steps a dog one tile along its rail.
 *  - Searchlights (optional) sit in wall cells like cameras but nobody turns them: after EVERY action they swing a quarter turn
 *    clockwise by themselves. "Wait" is an action that changes nothing else, so only the searchlights swing.
 *  - Power panels (optional) sit in wall cells. A panel is wired to two or three cameras, doors or mirrors; those can then only be
 *    operated through the panel, and one tap on it advances all of them at once (cameras a quarter turn, doors and mirrors flip).
 *  - Glass walls (optional, a static feature of the map): light passes straight through them, but nobody can walk through,
 *    and a dog's scent stops at them too. They are the opposite of a door: sight without a way through.
 *  - Walls, guards and closed doors stop sight. Guards, closed doors and mirrors block movement.
 *  - The thief may stand only on dark cells. Walking is free; only actions on watchers/objects count.
 *    An action is illegal if it lights the thief's cell (he picks the best cell in his dark region
 *    before each action).
 *  - Par = the fewest actions, by exact search.
 *
 * Cameras only turn clockwise (a 270 degree turn costs 3). Doors, mirrors and guard turns undo themselves in one action;
 * a guard step is undone by the opposite step.
 * The generator searches backwards from "the exit is reachable" over the whole state graph, which gives the
 * par of every possible starting state at once.
 */
(function () {
'use strict';
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const MIRROR = [[1, 0, 3, 2], [3, 2, 1, 0]];       // state 0 = "/", state 1 = "\"; indexed by travel direction

function mulberry32(a) {

    a |= 0; a = a + 0x6D2B79F5 | 0;

/* level = { w,h, wall:Uint8Array, S, E, cams:[{c,d}], guards:[{rail:[cells], i, f, range}], toggles:[{c, kind:'door'|'mirror', s}] }
   digits: cameras (facing 0..3), guards (i*2+f), toggles (0/1: door 1 = closed, mirror 0 = "/" 1 = "\"). */
let L_W = 0;
function prepare(L) { L_W = L.w; }
const counts = L => [L.cams.length, L.guards.length, (L.toggles || []).length, (L.dogs || []).length, (L.lights || []).length];
function radices(L) {
  return L.cams.map(() => 4).concat(L.guards.map(g => g.rail.length * 2), (L.toggles || []).map(() => 2), (L.dogs || []).map(d => d.rail.length), (L.lights || []).map(() => 4));
}
function initialDigits(L) {
  return L.cams.map(c => c.d).concat(L.guards.map(g => g.i * 2 + g.f), (L.toggles || []).map(t => t.s), (L.dogs || []).map(d => d.i), (L.lights || []).map(l => l.d));
}
/* Panels: L.panels = [{c, links:[digit index, ...]}]; a linked camera / door / mirror has no action of its own. */
function wiredOf(L) {

}
/* The digits after tapping panel j, or null when a door would close on a dog standing in it. */
function panelApply(L, dg, j) {
  const [nc, ng] = counts(L), p = L.panels[j], d2 = dg.slice();
  for (const i of p.links) {
    if (i < nc) { d2[i] = (dg[i] + 1) % 4; continue; }
    const t = L.toggles[i - nc - ng];
    if (t.kind === 'door' && dg[i] === 0 && (L.dogs || []).some((d, q) => d.rail[dg[nc + ng + L.toggles.length + q]] === t.c)) return null;

}
/* After every action each searchlight swings a quarter turn clockwise (digits are copied). */

  for (let j = 0; j < ls.length; j++) d2[b + j] = (dg[b + j] + 1) % 4;

}
function guardFacingDir(g, f) {            // direction index the guard looks (f=0 toward the last rail cell)
  const w = L_W, a = g.rail[0], b = g.rail[g.rail.length - 1];

/* Lit cells + blocked cells for one configuration. With wantRays it also returns the sight-line

function evalConfig(L, digits, wantRays) {

  const gpos = L.guards.map((g, k) => g.rail[digits[nc + k] >> 1]);
  for (const c of gpos) { occ[c] = 1; opq[c] = 1; }

    const v = digits[nc + ng + j];
    if (t.kind === 'door') { if (v === 1) { occ[t.c] = 1; opq[t.c] = 1; } }
    else { occ[t.c] = 1; mir[t.c] = v; }

  for (const c of dpos) occ[c] = 1;
  for (const c of dpos) {                                  // a dog smells every tile it can walk to
    const st = [];
    for (let d = 0; d < 4; d++) { const x = c % w + DX[d], y = ((c / w) | 0) + DY[d]; if (x >= 0 && y >= 0 && x < w && y < h) { const q = y * w + x; if (!wall[q] && !occ[q] && !scent[q]) { scent[q] = 1; st.push(q); } } }
    while (st.length) {
      const q = st.pop(), qx = q % w, qy = (q / w) | 0;
      for (let d = 0; d < 4; d++) { const x = qx + DX[d], y = qy + DY[d]; if (x < 0 || y < 0 || x >= w || y >= h) continue; const r = y * w + x; if (!wall[r] && !occ[r] && !scent[r]) { scent[r] = 1; st.push(r); } }
    }
  }
  for (let c = 0; c < n; c++) if (scent[c]) lit[c] = 1;
  const rays = wantRays ? [] : null;
  const cast = (start, d0, range, who) => {
    let d = d0, x = start % w, y = (start / w) | 0, cur = { src: start, d, cells: [], who, first: true };
    const segs = [];
    for (let s = 0; s < range; s++) {
      x += DX[d]; y += DY[d];
      if (x < 0 || y < 0 || x >= w || y >= h) break;
      const c = y * w + x;
      if (wall[c]) break;
      if (mir[c] >= 0) { segs.push(cur); d = MIRROR[mir[c]][d]; cur = { src: c, d, cells: [], who, first: false }; continue; }
      if (opq[c]) break;
      lit[c] = 1; cur.cells.push(c);
    }
    segs.push(cur);
    if (rays) for (const sg of segs) rays.push(sg);
  };
  L.cams.forEach((cm, k) => cast(cm.c, digits[k], 99, k));
  L.guards.forEach((g, k) => cast(gpos[k], guardFacingDir(g, digits[nc + k] & 1), g.range, nc + k));
  (L.lights || []).forEach((l, j) => cast(l.c, digits[nc + ng + nt + nd + j], 99, nc + ng + nt + nd + j));
  return { lit, occ, rays, scent };
}

/* dark, free regions of one configuration */
function labelConfig(L, dg) {
  const { w, h, wall } = L, n = w * h, { lit, occ } = evalConfig(L, dg, false), lab = new Int8Array(n).fill(-1);
  let k = 0;
  const st = [];
  for (let s = 0; s < n; s++) {
    if (wall[s] || lit[s] || occ[s] || lab[s] >= 0) continue;
    st.push(s); lab[s] = k;
    while (st.length) {
      const c0 = st.pop(), x = c0 % w, y = (c0 / w) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const q = ny * w + nx;
        if (wall[q] || lit[q] || occ[q] || lab[q] >= 0) continue;
        lab[q] = k; st.push(q);
      }
    }
    k++;
  }
  return { lab, k };
}

/* every single action from a configuration: [newDigits, which watcher] */
function actions(L, dg) {
  const out = actions0(L, dg), ls = L.lights || [];
  if (!ls.length) return out;
  for (const o of out) o[0] = sweep(L, o[0]);                       // the lights swing after whatever the player did
  out.push([sweep(L, dg), dg.length - ls.length]);                    // Wait: only the lights swing (attributed to the first light)
  return out;
}
function actions0(L, dg) {
  const [nc, ng] = counts(L), out = [];
  const wired = wiredOf(L);
  L.cams.forEach((cm, k) => { if (wired.has(k)) return; const d2 = dg.slice(); d2[k] = (dg[k] + 1) % 4; out.push([d2, k]); });   // clockwise only
  L.guards.forEach((g, j) => {
    const k = nc + j, v = dg[k], i = v >> 1, f = v & 1;
    const taken = ni => L.guards.some((o, q) => q !== j && o.rail[dg[nc + q] >> 1] === g.rail[ni]);
    for (const s of [1, -1]) {                       // a step also turns the guard to face the way it walks
      const ni = i + s;
      if (ni < 0 || ni >= g.rail.length || taken(ni)) continue;
      const d2 = dg.slice(); d2[k] = ni * 2 + (s === 1 ? 0 : 1); out.push([d2, k]);
    }
    const d2 = dg.slice(); d2[k] = i * 2 + (1 - f); out.push([d2, k]);
  });
  const nt = (L.toggles || []).length;
  (L.toggles || []).forEach((t, j) => {
    const k = nc + ng + j;
    if (wired.has(k)) return;
    // a door cannot close on a dog standing in the doorway
    if (t.kind === 'door' && dg[k] === 0 && (L.dogs || []).some((d, q) => d.rail[dg[nc + ng + nt + q]] === t.c)) return;
    const d2 = dg.slice(); d2[k] = 1 - dg[k]; out.push([d2, k]);
  });
  (L.dogs || []).forEach((d, j) => {
    const k = nc + ng + nt + j, i = dg[k];
    const taken = cell => L.guards.some((g, q) => g.rail[dg[nc + q] >> 1] === cell) || (L.dogs || []).some((o, q) => q !== j && o.rail[dg[nc + ng + nt + q]] === cell) ||
      (L.toggles || []).some((t, q) => t.c === cell && (t.kind === 'mirror' || dg[nc + ng + q] === 1));

  });

/* Exact BFS over (configuration, dark region the thief is in). opts: digits/thief to start elsewhere. */
function solve(L, opts) {

/* ASCII of a configuration: # wall . dark ~ lit, S/E, arrows = cameras, a-d guards, X/x doors, / \ mirrors */

];
const chapStart = CHAPTERS.map((_, i) => CHAPTERS.slice(0, i).reduce((n, c) => n + c.size, 0));
const chapterOf = i => { let ci = 0; while (ci + 1 < CHAPTERS.length && i >= chapStart[ci + 1]) ci++; return ci; };    // level index -> chapter index
const chapNeed = ci => Math.round(chapStart[ci] * 3 * STARS_FRACTION);                                                 // stars from earlier chapters needed to enter
let best = store.get('pb_best3', {});
function starsBefore(ci) { let s = 0; for (let i = 0; i < chapStart[ci] && i < LEVELS.length; i++) s += (best[LEVELS[i].id] && best[LEVELS[i].id].stars) || 0; return s; }
const chapterLocked = ci => !settings.unlockAll && ci > 0 && starsBefore(ci) < chapNeed(ci);
const levelLocked = i => chapterLocked(chapterOf(i));
function firstOpenLevel() { for (let i = 0; i < LEVELS.length; i++) if (!levelLocked(i) && !best[LEVELS[i].id]) return i; return Math.max(0, LEVELS.length - 1); }

function iconData(name) {
  if (!iconCache[name]) {
    const rows = ICONS[name], w = rows[0].length, h = rows.length, c = document.createElement('canvas'); c.width = w * 6; c.height = h * 6;
    const x = c.getContext('2d'); x.fillStyle = '#000';

/* All sounds are synthesised with WebAudio (no audio files); the context starts on the first touch. See docs/sound-design.md. */
const Sfx = (() => {
  let ac = null, master = null;
  const get = () => {
    if (ac === null) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = settings.vol / 100 * .8; master.connect(ac.destination); } catch (e) { ac = false; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  };
  const tone = (a, t, f0, f1, dur, type, vol, delay = 0, lp = 0) => {
    const o = a.createOscillator(), g = a.createGain(); let out = o;
    o.type = type; o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + delay + dur);
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); out = f; }
    g.gain.setValueAtTime(0.0001, t + delay); g.gain.exponentialRampToValueAtTime(vol, t + delay + .008); g.gain.exponentialRampToValueAtTime(.0001, t + delay + dur);
    out.connect(g); g.connect(master); o.start(t + delay); o.stop(t + delay + dur + .02);
  };
  const noise = (a, t, dur, vol, delay = 0, hp = 1500) => {
    const n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t + delay);
  };
  const S = {
    click: (a, t) => tone(a, t, 900, 700, .03, 'square', .04),
    step: (a, t) => { tone(a, t, 150 + Math.random() * 25, 90, .06, 'triangle', .13); noise(a, t, .03, .03, 0, 3000); },
    cam: (a, t) => { tone(a, t, 170, 330, .2, 'sawtooth', .07, 0, 900); tone(a, t, 1300, 1300, .02, 'square', .05, .2); },
    guardStep: (a, t) => { tone(a, t, 130, 55, .14, 'sine', .3); noise(a, t, .05, .05, 0, 2000); },
    dogStep: (a, t) => { tone(a, t, 240, 150, .09, 'sawtooth', .09, 0, 700); noise(a, t, .03, .04, .08, 2500); noise(a, t, .03, .04, .14, 2500); },
    panel: (a, t) => { tone(a, t, 1200, 180, .12, 'square', .07, 0, 2500); noise(a, t, .06, .06, 0, 3500); tone(a, t, 90, 60, .12, 'sine', .2, .06); },
    sweep: (a, t) => { tone(a, t, 220, 360, .2, 'sawtooth', .06, 0, 800); tone(a, t, 1500, 1500, .015, 'square', .04, .2); },
    wait: (a, t) => { tone(a, t, 330, 330, .05, 'triangle', .1); tone(a, t, 220, 360, .2, 'sawtooth', .06, .05, 800); tone(a, t, 1500, 1500, .015, 'square', .04, .25); },
    turn: (a, t) => { tone(a, t, 520, 330, .07, 'square', .05); tone(a, t, 400, 300, .07, 'square', .05, .08); noise(a, t, .12, .03, 0, 4000); },
    door: (a, t) => { tone(a, t, 210, 110, .16, 'square', .07, 0, 700); noise(a, t, .08, .05, .02, 1200); tone(a, t, 90, 60, .1, 'sine', .22, .12); },
    mirror: (a, t) => { tone(a, t, 1900, 2600, .1, 'sine', .07); tone(a, t, 2600, 3100, .08, 'sine', .04, .05); },
    refuse: (a, t) => { tone(a, t, 110, 100, .2, 'square', .09, 0, 700); tone(a, t, 117, 104, .2, 'square', .07, 0, 700); },
    spotted: (a, t) => { for (let i = 0; i < 4; i++) tone(a, t, i % 2 ? 660 : 880, i % 2 ? 660 : 880, .09, 'square', .07, i * .1, 2400); },
    caught: (a, t) => { tone(a, t, 440, 90, .55, 'sawtooth', .1, 0, 1400); tone(a, t, 90, 50, .3, 'sine', .3, .45); },
    win: (a, t) => { [523, 659, 784, 1047].forEach((f, i) => tone(a, t, f, f, .16, 'triangle', .13, i * .09)); tone(a, t, 2093, 2093, .35, 'sine', .05, .4); },

  const R = null;
